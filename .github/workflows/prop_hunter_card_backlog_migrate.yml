name: PROP HUNTER Historical Telegram Photo Repair
"on":
  push:
    paths:
      - ".github/card-backlog-repaint-trigger"
      - ".github/workflows/prop_hunter_card_backlog_migrate.yml"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: prop-hunter-history-writer
  cancel-in-progress: false
jobs:
  repaint:
    # The first run is explicitly activated by a trigger commit.
    # Further runs are requested only while the last batch filled its cap.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[backlog-photos]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-card renderer
        run: python -m pip install 'requests>=2.31' 'Pillow>=10'
      - name: Verify original-card output and safe edit limits
        run: |
          python -m py_compile prop_hunter_original_compositor.py prop_hunter_image_cards.py prop_hunter_card_only_migrate.py
          python prop_hunter_poster_families_test.py
          python prop_hunter_card_only_targeted_test.py
          python prop_hunter_media_settlement_test.py
          python prop_hunter_results_writer_safety_test.py
      - name: Update one bounded batch of older bot-owned Telegram PHOTOS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PH_CARD_ONLY_PHOTOS_ONLY: '1'
          PH_CARD_ONLY_MAX_UPDATES: '60'
          PH_CARD_ONLY_LOOKBACK_DAYS: '30'
          PH_CARD_ONLY_TARGET_DATES: '2026-11-05,2026-11-06,2026-11-07,2026-11-08,2026-11-09,2026-11-10,2026-11-11,2026-11-12,2026-11-13,2026-11-14,2026-11-15,2026-11-16,2026-11-17'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram bot credentials unavailable; do not attempt edits"
            exit 1
          fi
          python -u prop_hunter_card_only_migrate.py
      - name: Preserve updated card history and audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python -m json.tool picks_history.json >/dev/null
          python -m json.tool diagnostics/prop_hunter_card_only_migration_status.json >/dev/null
          git add picks_history.json diagnostics/prop_hunter_card_only_migration_status.json
          if ! git diff --staged --quiet; then
            git commit -m 'prop hunter: checkpoint older Telegram photo repairs [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Committed updated original Telegram IDs"
                exit 0
              fi
              sleep $((attempt*3))
            done
            exit 1
          fi
      - name: Validate actual Telegram acknowledgements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('diagnostics/prop_hunter_card_only_migration_status.json').read_text())
          print(f"HISTORICAL_PHOTO_BATCH changed={r.get('photo_updated',0)} identical={r.get('photo_unchanged',0)} failed={r.get('failed',0)} attempted={r.get('candidates',0)} capped={r.get('batch_limit_reached',False)}")
          if int(r.get('failed') or 0):
              raise SystemExit('Telegram rejected photo edits: stop automatic follow-up for investigation')
          PY
      - name: Queue next bounded batch only if there are more older photos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('diagnostics/prop_hunter_card_only_migration_status.json').read_text())
          print('yes' if r.get('batch_limit_reached') and not r.get('failed') else 'no')
          PY
          )
          if [ "$remaining" = yes ]; then
            echo 'Checkpoint saved; queuing next capped PHOTO-only batch'
            gh workflow run prop_hunter_card_backlog_migrate.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo 'Photo-only backlog finished or blocked by a reported error; no further job queued'
          fi
