name: Prop Hunter Data Plus

on:
  workflow_dispatch:
  schedule:
    # Runs before the main bot. Adjust if your main bot runs at another time.
    - cron: "10 */6 * * *"

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data requirements
        run: pip install -r requirements_data_plus.txt
      - name: Collect DATA+ cache
        run: python prop_hunter_scraper.py
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Upload DATA+ cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-data-cache
          path: prop_hunter_data_cache.json
