name: PROP HUNTER Approve Validated Owner Original Plates

"on":
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/prop_hunter_approve_owner_originals.yml'

permissions:
  contents: write

jobs:
  approve-source-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated validation dependencies
        run: python -m pip install --quiet pillow numpy requests cairosvg
      - name: Validate actual original bitmap compositor and all four clean plates
        run: |
          python -m py_compile prop_hunter_nba_owner_bridge.py prop_hunter_original_compositor.py
          python test_prop_hunter_nba_owner_bridge.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          from prop_hunter_original_compositor import CROP
          original=Path('card_templates/originals')
          clean=Path('card_templates/cleaned')
          for family in ('single','ladder','builder','lottery'):
              with Image.open(original/(family+'.jpg')) as raw, Image.open(clean/(family+'.png')) as plate:
                  source=raw.convert('RGB').crop(CROP[family])
                  assert plate.size == source.size, family
                  # Unmasked original crown / NBA badge must remain the owner's artwork.
                  assert ImageChops.difference(
                      source.crop((200,0,490,34)),
                      plate.crop((200,0,490,34))).getbbox() is None, family
                  assert ImageChops.difference(source,plate.convert('RGB')).getbbox() is not None
                  print('OWNER_ASSET_APPROVAL_CHECK_OK',family)
          PY
      - name: Commit four verified owner source plates for guarded production
        run: |
          set -e
          mkdir -p card_templates/approved
          for family in single ladder builder lottery; do
            cp "card_templates/cleaned/${family}.png" "card_templates/approved/${family}.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add card_templates/approved/single.png card_templates/approved/ladder.png \
                  card_templates/approved/builder.png card_templates/approved/lottery.png
          if git diff --staged --quiet; then
            echo 'Four owner source plates already approved and stored'
            exit 0
          fi
          git commit -m 'assets: approve four true owner-original source plates for validated renders'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'OWNER_ORIGINAL_APPROVED_PLATES_STORED=4'
              exit 0
            fi
            sleep $((3 * attempt))
          done
          echo 'CRITICAL: Approved original owner assets not committed'
          exit 1
