name: Prop Hunter Swiss NL Data

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '35 7 * * *'
  push:
    paths:
      - 'prop_hunter_backfill_swiss_nl.py'
      - 'prop_hunter_backfill_swiss_nl_test.py'
      - '.github/swiss-nl-data-trigger'

permissions:
  contents: read

concurrency:
  group: prop-hunter-swiss-nl-data
  cancel-in-progress: true

jobs:
  swiss-nl-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_results.txt
      - name: Install
        run: pip install -r requirements_results.txt
      - name: Regression
        run: |
          python -m py_compile prop_hunter_backfill_swiss_nl.py prop_hunter_gamelog_retention.py prop_hunter_feature_builder.py
          python prop_hunter_backfill_swiss_nl_test.py
          python prop_hunter_hockey_feature_test.py
      - name: Collect Swiss NL and rebuild features
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PH_SWISS_NL_LAST_N: '40'
          PH_SWISS_NL_MAX_GAMES: '340'
          PH_GAMELOG_KEEP_PER_PLAYER: '40'
          PH_FEATURE_WRITE_BATCH: '400'
        run: |
          python prop_hunter_backfill_swiss_nl.py
          python prop_hunter_gamelog_retention.py --apply
          python prop_hunter_feature_builder.py
