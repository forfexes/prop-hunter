name: Prop Hunter Source Discovery Automatic

"on":
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'  # one weekly run; saves Actions minutes

permissions:
  contents: write

concurrency:
  group: prop-hunter-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt


      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              raise SystemExit("Supabase preflight failed: SUPABASE_URL/SUPABASE_KEY missing")
          req = urllib.request.Request(
              f"{url}/rest/v1/prop_hunter_db_health?select=table_name,rows&limit=1",
              headers={"apikey": key},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f"Supabase preflight failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "ignore")[:300]
              raise SystemExit(f"Supabase preflight failed: HTTP {exc.code} {body}")
          except Exception as exc:
              raise SystemExit(f"Supabase preflight failed: {exc}")
          print("Supabase preflight OK")
          PY

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Audit and discover sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB,WNBA,NBA,NFL
          PH_BROWSER_BOOKS: betmgm,caesars,betrivers,superbook,fanatics,hardrock,thescore,bet365,action_network,betr,dabble,chalkboard,parlayplay
          PH_MAX_BROWSER_JOBS: '12'
        run: |
          python prop_hunter_source_audit.py || true
          python prop_hunter_github_source_scanner.py || true
          python prop_hunter_web_source_scanner.py || true
          python prop_hunter_candidate_tester.py || true
          python prop_hunter_source_orchestrator.py --mode all || true

      - name: Weekly official-data backfills
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python prop_hunter_statcast_backfill.py || true
          python prop_hunter_feature_builder.py || true

      - name: Save source registry and learning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            prop_hunter_github_sources.json prop_hunter_web_sources.json \
            prop_hunter_candidate_health.json prop_hunter_source_registry.json \
            prop_hunter_source_trust.json prop_hunter_model_registry.json \
            prop_hunter_autolearn_report.json prop_hunter_builder_correlations.json \
            2>/dev/null || true
          git diff --staged --quiet && echo "No maintenance changes" && exit 0
          git commit -m "prop hunter source discovery $(date -u +%F)"
          git push
