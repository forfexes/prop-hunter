name: Prop Hunter Self Maintenance

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '15 3 * * 0'

permissions:
  contents: write

concurrency:
  group: prop-hunter-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # No Chromium here: discovery must not burn Actions minutes.

      - name: Integrity
        env:
          PH_EXPECTED_RUNTIME_VERSION: 13.9.0-SELF-MAINTAINING
        run: |
          python -m compileall -q .
          python prop_hunter_runtime_guard.py

      - name: Source health and discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB,WNBA,NBA,NFL,NHL,NCAAB,NCAAF
          PH_BROWSER_ENABLED: '0'
          PH_FAST_BROWSER_JOBS: '0'
          PH_SKIP_BLOCKED_FREE: '1'
        run: |
          python prop_hunter_source_audit.py || true
          python prop_hunter_github_watcher.py || true
          python prop_hunter_source_orchestrator.py --mode fast || true

      - name: Autonomous learning and coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python prop_hunter_learning_update.py
          python prop_hunter_model_registry.py
          python prop_hunter_coverage_watchdog.py
          python prop_hunter_market_discovery.py
          python prop_hunter_retrainer.py || true

      - name: Save learned state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prop_hunter_source_audit.json prop_hunter_source_trust.json \
            prop_hunter_model_registry.json prop_hunter_autolearn_report.json \
            prop_hunter_coverage_report.json prop_hunter_market_discovery.json \
            prop_hunter_identity_cache.json ml_model.pkl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter self maintenance $(date -u +%F)"
          git push
