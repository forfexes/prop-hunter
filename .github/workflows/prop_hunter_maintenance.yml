name: Prop Hunter Maintenance Automatic

on:
  workflow_dispatch:
  schedule:
    # Sonntags 04:15 UTC.
    - cron: '15 4 * * 0'

concurrency:
  group: prop-hunter-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Source audit and reliability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: |
          python prop_hunter_source_audit.py || true
          python prop_hunter_source_reliability.py || true
          python prop_hunter_github_source_scanner.py || true

      - name: Weekly backfills
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python prop_hunter_statcast_backfill.py || true
          python prop_hunter_retrosheet_import.py || true
          python prop_hunter_backfill_universal.py || true
