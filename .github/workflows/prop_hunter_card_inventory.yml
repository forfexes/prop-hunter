name: PROP HUNTER Read-Only Card Inventory
"on":
  push:
    paths:
      - 'prop_hunter_card_inventory.py'
      - '.github/workflows/prop_hunter_card_inventory.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal audit dependencies
        run: python -m pip install 'Pillow>=10' 'requests>=2.31'
      - name: Count saved Telegram originals without editing them
        run: python -u prop_hunter_card_inventory.py
      - name: Save inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-card-inventory
          path: diagnostics/prop_hunter_card_inventory.json
          if-no-files-found: error
          retention-days: 7
