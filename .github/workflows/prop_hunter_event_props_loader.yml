name: Prop Hunter Event Props Loader

on:
  workflow_dispatch:

jobs:
  event-props-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Compile event props loader
        run: python -m py_compile prop_hunter_theodds_event_props.py

      - name: Run event props loader
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_REGIONS: us,eu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_EVENT_LIMIT_PER_SPORT: 20
        run: python prop_hunter_theodds_event_props.py

      - name: Upload event props cache
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-event-props-cache
          path: prop_hunter_event_props_cache.json
