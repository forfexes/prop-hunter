name: Prop Hunter American Props
on:
  schedule:
    - cron: '20 */6 * * *'   # alle 6h automatisch
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport (leer = alle)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  prop_hunter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # wenn NFL off-season → andere laufen trotzdem
      matrix:
        sport: [baseball_mlb, basketball_nba, americanfootball_nfl, icehockey_nhl, basketball_wnba]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests supabase

      - name: Scrape Props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TARGET="${{ github.event.inputs.sport }}"
          if [ -z "$TARGET" ]; then TARGET="${{ matrix.sport }}"; fi
          echo "Sport: $TARGET"
          python american_props_scraper.py --sport "$TARGET" --max-events 25 || echo "Keine Events (Off-Season)"

      - name: Load + EV Filter + Telegram
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f american_props_output.json ]; then
            python prop_hunter_loader.py --input american_props_output.json --telegram
          else
            echo "Keine Props Datei — überspringe"
          fi
