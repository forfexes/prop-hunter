name: Prop Hunter Daily

on:
  schedule:
    - cron: '0 15 * * *'   # 17:00 CEST
    - cron: '0 20 * * *'   # 22:00 CEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-prophunter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pybaseball nba_api nfl_data_py

      - name: Run Prop Hunter
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python prophunter.py

      - name: Save picks history
        run: |
          git config user.name "prophunter-bot"
          git config user.email "bot@prophunter.local"
          git add picks_history.json || true
          git commit -m "picks $(date +%F-%H%M)" || echo "nothing to commit"
          git push || echo "nothing to push"
