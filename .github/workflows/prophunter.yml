keine vergangenen tipps beim run

Das ist der Results Evaluator — der läuft separat. Hast du den als eigenen GitHub Actions Workflow eingerichtet? Er müsste täglich früh morgens laufen (z.B. cron: '0 8 * * *') und braucht die picks_history.json aus dem Repo.

Hast du dafür schon ein YML?

name: Prop Hunter Results
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests pydantic python-dateutil MLB-StatsAPI supabase
      - name: Run Results
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prophunter_results.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A picks_history.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "results $(date -u +%F)"
          git push

