name: Prop Hunter Automatic

on:
  workflow_dispatch:
  schedule:
    # UTC. Entspricht in der Schweizer Sommerzeit:
    # 10:00 Daten + ML, 18:30 Early Card, 23:00 Late Card.
    - cron: '0 8 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

concurrency:
  group: prop-hunter-main
  cancel-in-progress: false

jobs:
  prop-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Resolve automatic mode
        shell: bash
        run: |
          MODE="data"
          CARD="all"
          UTC_NOW="$(date -u +'%H:%M')"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="card"
            CARD="all"
          else
            case "$UTC_NOW" in
              "16:30") MODE="card"; CARD="early" ;;
              "21:00") MODE="card"; CARD="late" ;;
              *)       MODE="data"; CARD="all" ;;
            esac
          fi

          echo "PH_RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "PH_CARD_MODE=$CARD" >> "$GITHUB_ENV"
          echo "Automatic mode: $MODE / $CARD"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Compile critical files
        run: |
          python -m py_compile \
            prophunter.py \
            prop_hunter_source_hub.py \
            prop_hunter_shared_utils.py \
            prop_hunter_odds_sportsgameodds.py \
            prop_hunter_odds_oddsapi_io.py \
            prop_hunter_odds_pp_ud.py \
            prop_hunter_feature_builder.py \
            prop_hunter_learning_update.py

      - name: Update DATA plus
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python prop_hunter_scraper.py || true

      - name: Refresh all source fallbacks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          PROP_HUNTER_SPORTS: MLB,WNBA,NBA,NFL
        run: |
          python prop_hunter_odds_sportsgameodds.py || true
          python prop_hunter_odds_oddsapi_io.py || true
          python prop_hunter_odds_pp_ud.py || true
          python prop_hunter_source_hub.py || true

      - name: Update history
        if: env.PH_RUN_MODE == 'data'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LAST_N_GAMES: '30'
        run: python prop_hunter_history_scraper.py || true

      - name: Build features
        if: env.PH_RUN_MODE == 'data'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python prop_hunter_feature_builder.py || true

      - name: Train ML automatically
        if: env.PH_RUN_MODE == 'data'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # prophunter.py prüft selbst, ob genug gesettelte Picks vorhanden sind.
          python prophunter.py --train-ml || true
          python prop_hunter_learning_update.py || true

      - name: Run Early or Late card
        if: env.PH_RUN_MODE == 'card'
        env:
          PH_CARD_MODE: ${{ env.PH_CARD_MODE }}
          PH_TIMEZONE: Europe/Zurich
          PH_EARLY_CUTOFF: '00:30'
          PH_LOOKAHEAD_H: '16'
          PH_MAX_EVENTS: '20'

          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PH_MIN_EDGE: '3.0'
          PH_MAX_PER_PLAYER: '3'
          PH_MAX_PER_GAME: '6'
        run: python prophunter.py --card-mode "$PH_CARD_MODE"

      - name: Data update complete
        if: env.PH_RUN_MODE == 'data'
        run: echo "Data, sources, features and automatic ML update completed."
