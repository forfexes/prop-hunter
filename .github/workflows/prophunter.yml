name: Prop Hunter V9

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

jobs:
  run-prop-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide run mode
        shell: bash
        run: |
          HOUR_MIN="$(date -u +'%H:%M')"
          echo "UTC time: $HOUR_MIN"

          if [ "$HOUR_MIN" = "16:30" ] || [ "$HOUR_MIN" = "21:00" ]; then
            echo "PH_RUN_MODE=final" >> "$GITHUB_ENV"
          else
            echo "PH_RUN_MODE=data" >> "$GITHUB_ENV"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PH_RUN_MODE=final" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Run DATA+ scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -f prop_hunter_scraper.py ]; then
            python -m py_compile prop_hunter_scraper.py
            python prop_hunter_scraper.py
          else
            echo "prop_hunter_scraper.py not found, skip"
          fi

      - name: Run History Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LAST_N_GAMES: 30
        run: |
          if [ -f prop_hunter_history_scraper.py ]; then
            python -m py_compile prop_hunter_history_scraper.py
            python prop_hunter_history_scraper.py
          else
            echo "prop_hunter_history_scraper.py not found, skip"
          fi

      - name: Fetch American Player Props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: |
          python -m py_compile american_props_scraper.py
          python american_props_scraper.py --sport all --regions us,eu --max-events 20 --output american_props_output.json
          ls -lh american_props_output.json
          python - <<'PY'
          import json
          p='american_props_output.json'
          data=json.load(open(p,encoding='utf-8'))
          print('american_props_output rows=', len(data))
          print('sample=', data[0] if data else None)
          PY

      - name: Load American Props to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PH_MIN_EDGE: "3.0"
        run: |
          python -m py_compile prop_hunter_loader.py
          python prop_hunter_loader.py --input american_props_output.json --min-edge 3.0

      - name: Run Prop Hunter final card
        if: env.PH_RUN_MODE == 'final'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PH_MIN_EDGE: "3.0"
          PH_MAX_PICKS_TOTAL: "50"
          PH_MAX_PER_PLAYER: "3"
          PH_MAX_PER_GAME: "6"
        run: |
          python -m py_compile prophunter.py
          python prophunter.py

      - name: Data-only done
        if: env.PH_RUN_MODE == 'data'
        run: echo "Data update + props load done. No Telegram card on morning/data run."
