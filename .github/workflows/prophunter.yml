name: Prop Hunter v3
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-prophunter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install requests pydantic python-dateutil pybaseball MLB-StatsAPI nfl_data_py py_ball rapidfuzz playwright supabase
          playwright install chromium --with-deps
      - name: Run
        env:
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        run: python prophunter.py
      - name: Save picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A picks_history.json odds_cache.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "picks $(date -u +%F-%H%M)"
          git push

