name: Prop Hunter Final Coverage

on:
  workflow_dispatch:
    inputs:
      run_backfill:
        description: 'Run backfills/results/settlement'
        required: false
        default: 'true'
      run_extra_odds:
        description: 'Run extra odds connectors'
        required: false
        default: 'true'
  schedule:
    - cron: '15 */3 * * *'

jobs:
  run-prop-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests pandas pyarrow supabase nba_api nflreadpy pybaseball MLB-StatsAPI beautifulsoup4 lxml python-dotenv rapidfuzz pydantic cloudscraper
          python -m playwright install chromium || true

      - name: Compile check
        run: |
          python -m py_compile prophunter.py
          python -m py_compile prop_hunter_scraper.py || true
          python -m py_compile prop_hunter_shared_utils.py || true

      - name: Run DATA+ scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -f prop_hunter_scraper.py ]; then
            python prop_hunter_scraper.py
          else
            echo "prop_hunter_scraper.py not found, skip"
          fi

      - name: Run History Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LAST_N_GAMES: 30
        run: |
          if [ -f prop_hunter_history_scraper.py ]; then
            python prop_hunter_history_scraper.py
          else
            echo "prop_hunter_history_scraper.py not found, skip"
          fi

      - name: Run extra odds connectors
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_extra_odds == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          PROP_HUNTER_SPORTS: MLB,NBA,WNBA,NFL
        run: |
          if [ -f prop_hunter_odds_pp_ud.py ]; then python prop_hunter_odds_pp_ud.py; fi
          if [ -f prop_hunter_odds_oddsapi_io.py ]; then python prop_hunter_odds_oddsapi_io.py; fi
          if [ -f prop_hunter_odds_sportsgameodds.py ]; then python prop_hunter_odds_sportsgameodds.py; fi
          if [ -f prop_hunter_odds_opticodds.py ]; then python prop_hunter_odds_opticodds.py; fi

      - name: Run results/backfill/settlement
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_backfill == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LAST_N_GAMES: 30
          NBA_SEASON: 2025-26
          NFL_SEASON: 2025
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -f prop_hunter_backfill_universal.py ]; then python prop_hunter_backfill_universal.py; fi
          if [ -f prop_hunter_results_nba.py ]; then python prop_hunter_results_nba.py; fi
          if [ -f prop_hunter_results_wnba.py ]; then python prop_hunter_results_wnba.py; fi
          if [ -f prop_hunter_results_nfl.py ]; then python prop_hunter_results_nfl.py; fi
          if [ -f prop_hunter_results_mlb.py ]; then python prop_hunter_results_mlb.py; fi
          if [ -f espn_multisport_results.py ]; then python espn_multisport_results.py; fi

      - name: Run settlement + learning
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_backfill == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -f prop_hunter_settler.py ]; then python prop_hunter_settler.py; fi
          if [ -f prop_hunter_learning_update.py ]; then python prop_hunter_learning_update.py; fi

      - name: Run Prop Hunter
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
        run: python prophunter.py

      - name: Save picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A picks_history.json odds_cache.json || true
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "picks $(date -u +%F-%H%M)"
          git push
