wie ist die wahrscheinlichkeit

Dass die drei neuen Enrichment-Quellen (statz.ai, propcruncher, freeplayerprops) wirklich Daten liefern?

Realistisch eingeschätzt:

Quelle	Wahrscheinlichkeit	Risiko
propcruncher.com	60%	Cloudflare, robots.txt blockiert schon web_fetch
statz.ai	50%	JS-rendered, cloudscraper könnte zu wenig sein
freeplayerprops.com	70%	Game Log hat ohne JS funktioniert, Slug-Suche ist der schwache Punkt
Hauptrisiken:

Cloudflare 403/429 → cloudscraper hilft bei vielen Seiten, aber nicht allen
JS-rendered Tabellen → cloudscraper rendert kein JavaScript, nur Playwright kann das
Slug-Finder bei FPP → die Spielerliste muss erst geparst werden, könnte leer sein
Was sicher funktioniert: Der Bot läuft trotzdem normal weiter — alle drei Funktionen haben try/except und if not html: return props → bei Fehler einfach kein Enrichment, kein Absturz.

Empfehlung: Einmal manuell triggern und im Log schauen ob statz.ai: X Spieler geladen / propcruncher: X Spieler erscheint. Falls nicht → Playwright-Version bauen für die blockierten Seiten.

