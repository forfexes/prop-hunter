name: Prop Hunter V5 JK Style

on:
  workflow_dispatch:
  schedule:
    # Schweiz Sommerzeit:
    # 10:00 Datenupdate
    # 18:30 Final Card
    # 23:00 US Final Card
    - cron: '0 8 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

jobs:
  run-prop-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide run mode
        shell: bash
        run: |
          HOUR_MIN="$(date -u +'%H:%M')"
          echo "UTC time: $HOUR_MIN"

          if [ "$HOUR_MIN" = "16:30" ] || [ "$HOUR_MIN" = "21:00" ]; then
            echo "PH_RUN_MODE=final" >> "$GITHUB_ENV"
          else
            echo "PH_RUN_MODE=data" >> "$GITHUB_ENV"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PH_RUN_MODE=final" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          test -f requirements.txt
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Run DATA+ scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -f prop_hunter_scraper.py ]; then
            python -m py_compile prop_hunter_scraper.py
            python prop_hunter_scraper.py
          else
            echo "prop_hunter_scraper.py not found, skip"
          fi

      - name: Run History Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LAST_N_GAMES: 30
        run: |
          if [ -f prop_hunter_history_scraper.py ]; then
            python -m py_compile prop_hunter_history_scraper.py
            python prop_hunter_history_scraper.py
          else
            echo "prop_hunter_history_scraper.py not found, skip"
          fi

      - name: Apply V5 JK Style patch
        if: env.PH_RUN_MODE == 'final'
        run: |
          test -f prophunter.py
          test -f prop_hunter_v5_patch.py
          python prop_hunter_v5_patch.py
          python -m py_compile prophunter.py

      - name: Run Prop Hunter final card
        if: env.PH_RUN_MODE == 'final'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}

          # Qualität statt künstliches Gesamtlimit
          PH_MIN_EDGE: "3.0"
          PH_MAX_PER_PLAYER: "3"
          PH_MAX_PER_GAME: "6"

          # Style
          PH_OUTPUT_STYLE: "jk_simple"
          PH_HIDE_SOURCES: "1"
          PH_HIDE_DEBUG: "1"
        run: |
          python prophunter.py

      - name: Data-only done
        if: env.PH_RUN_MODE == 'data'
        run: echo "Data update done. No Telegram card on morning/data run."
