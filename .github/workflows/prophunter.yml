name: Prop Hunter Autonomous

"on":
  workflow_dispatch: {}
  push:
    paths:
      - '.github/card-trigger'
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: prop-hunter-history-writer
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # source collection + NBA model can exceed 10 min; avoid killing before Telegram delivery
    steps:
      - uses: actions/checkout@v4
        with:
          # Acquire the shared writer slot before reading the latest runtime.
          # A queued push SHA may predate the preceding writer's saved history.
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              raise SystemExit("Supabase preflight failed: SUPABASE_URL/SUPABASE_KEY missing")
          req = urllib.request.Request(
              f"{url}/rest/v1/prop_hunter_picks?select=id&limit=1",
              headers={"apikey": key},
          )
          import time
          # Lightweight indexed table check; avoid aggregate health views that
          # can time out even while the picks database is operational.
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      if response.status != 200:
                          raise SystemExit(f"Supabase preflight failed: HTTP {response.status}")
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "ignore")[:300]
                  transient = exc.code in (429, 500, 502, 503, 504)
                  if not transient or attempt == 2:
                      raise SystemExit(f"Supabase preflight failed: HTTP {exc.code} {body}")
                  print(f"Supabase preflight transient HTTP {exc.code}; retry {attempt + 1}/2")
              except (TimeoutError, urllib.error.URLError) as exc:
                  if attempt == 2:
                      raise SystemExit(f"Supabase preflight failed: {exc}")
                  print(f"Supabase preflight network error; retry {attempt + 1}/2")
              time.sleep(3 * (attempt + 1))
          print("Supabase preflight OK")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Chromium is intentionally not installed on normal card runs.

      - name: Local integrity gate
        env:
          PH_EXPECTED_RUNTIME_VERSION: 13.10.1-KEYLESS-HARDENED
        run: |
          python -m compileall -q .
          python prop_hunter_combo_prices_test.py
          python prop_hunter_card_quality_test.py
          python prop_hunter_poster_families_test.py
          python prop_hunter_card_design_migration_test.py
          python prop_hunter_card_pending_visual_test.py
          python prop_hunter_form_windows_test.py
          python prop_hunter_media_settlement_test.py
          python test_prop_hunter_nba_owner_bridge.py
          python prop_hunter_card_history_integrity_test.py
          python prop_hunter_dual_supabase_test.py
          python prop_hunter_nba_context_sources_test.py
          python prop_hunter_nba_context_engine_test.py
          python prop_hunter_nba_dvp_scraper_test.py
          python prop_hunter_rescue_over_guard_test.py
          python prop_hunter_mixed_builders_test.py
          python prop_hunter_ladder_l15_test.py
          python prop_hunter_runtime_guard.py

      - name: Upload four rendered card previews for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-four-poster-previews
          path: poster_previews/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Fast source/bookmaker collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
          PROP_HUNTER_SPORTS: MLB,NBA,WNBA,NFL,NHL,NCAAB,NCAAF,EUROLEAGUE
          PH_KEYLESS_BOOKS_ENABLED: '1'
          PH_KEYLESS_BOOKS: draftkings,fanduel,bovada,betrivers
          PH_KEYLESS_TIMEOUT: '5'
          PH_KEYLESS_MAX_EVENTS: '3'
          PH_KEYLESS_MAX_PROP_CATEGORIES: '6'
          PH_KEYLESS_CACHE_TTL: '600'
          PH_KEYLESS_SOURCE_BUDGET_SEC: '18'
          ODDSPAPI_KEYS: ${{ secrets.ODDSPAPI_KEYS }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          OPTICODDS_KEY: ${{ secrets.OPTICODDS_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          PH_ODDSPAPI_MAX_EVENTS: '2'
          PH_ODDSAPI_IO_MAX_EVENTS: '3'
          PH_ODDSAPI_IO_TIMEOUT: '6'
          PH_DIRECT_ROWS_PER_SPORT_TARGET: '50'
          PH_DIRECT_BOOK_TARGET: '5'
          PH_DIRECT_PAIR_TARGET: '15'
          PH_SOURCE_BUDGET_SEC: '165'
          PH_KAMBI_ENABLED: '1'
          PH_KAMBI_MAX_EVENTS: '3'
          PH_KAMBI_MAX_BRANDS: '4'
          PH_KAMBI_CACHE_TTL: '900'
          PH_KAMBI_BUDGET_SEC: '25'
          PH_KAMBI_TIMEOUT: '4'
          PH_1XBET_ENABLED: '1'
          PH_22BET_ENABLED: '1'
          PH_22BET_NFL_ENABLED: '1'
          PH_22BET_ALL_ENABLED: '1'
          PH_1XBET_MAX_EVENTS: '2'
          PH_1XBET_TIMEOUT: '4'
          PH_SGO_MAX_EVENTS: '4'
          PH_SGO_TIMEOUT: '6'
          PH_OPTICODDS_MAX_FIXTURES: '5'
          PH_OPTICODDS_TIMEOUT: '6'
          PH_OPTICODDS_BOOKS: DraftKings,FanDuel,BetMGM,Caesars,bet365
          PH_PARLAY_TIMEOUT: '6'
          PH_PARLAY_LIMIT: '5000'
          PH_PROPLINE_TIMEOUT: '6'
          PH_ODDSPAPI_MAX_ODDS_CALLS: '6'
          PH_FAST_BROWSER_BOOKS: bet365,betmgm,caesars,betrivers,fanatics,hardrock,thescore,betr,dabble,chalkboard,parlayplay
          PH_FAST_BROWSER_JOBS: '0'
          PH_SKIP_BLOCKED_FREE: '1'
          PH_BROWSER_ENABLED: '0'
          PH_BDL_MAX_GAMES: '4'
          PH_BDL_TIMEOUT: '5'
          PH_BDL_PROPS_ENABLED: '0'
        run: |
          if [ -f prop_hunter_source_orchestrator.py ]; then
            python prop_hunter_source_orchestrator.py --mode fast || echo "source orchestrator soft-fail; using in-engine collectors"
          else
            echo "source orchestrator absent; using in-engine collectors"
          fi

      - name: DATA cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          LAST_N_GAMES: '30'
        run: python prop_hunter_scraper.py || echo "DATA cache soft-fail; card continues"

      - name: Public NBA positional-defense scrape (optional, verified season only)
        timeout-minutes: 1
        run: |
          python prop_hunter_nba_dvp_scraper.py

      - name: Regenerate current NBA premium masters before publishing
        run: |
          python - <<'PY'
          from card_templates.nba_premium_v2.build_masters import build
          master = build()
          assert master["template_count"] == 52, "NBA master set incomplete"
          print("NBA_CURRENT_PREMIUM_MASTERS_GENERATED=52")
          PY

      - name: Build and post card
        env:
          PH_NBA_PREMIUM_V2: '1'  # use layered NBA masters for verified complete picks
          PH_NBA_PREMIUM_V2_REQUIRE: '1'  # strict premium-only; never use legacy image design
          PH_NBA_OWNER_ORIGINALS: '1'  # use approved actual user-original Singles Ladders and Builders
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
          ODDSPAPI_KEYS: ${{ secrets.ODDSPAPI_KEYS }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          OPTICODDS_KEY: ${{ secrets.OPTICODDS_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          PH_KEYLESS_BOOKS_ENABLED: '1'
          PH_22BET_ENABLED: '1'
          PH_22BET_NFL_ENABLED: '1'
          PH_22BET_ALL_ENABLED: '1'
          PH_ESTIMATED_SAME_GAME_BUILDERS: '0'
          PH_FLAT_SINGLE_STAKE: '1.0'
          PH_SGO_DIRECT: '0'
          PH_ODDS_HTTP_TIMEOUT: '5'
          PH_AI_RETRY: '0'
          PH_BROWSER_ENABLED: '0'
          PH_BDL_MAX_GAMES: '4'
          PH_BDL_TIMEOUT: '5'
          PH_BDL_PROPS_ENABLED: '0'
        run: |
          python prop_hunter_settler_fast_test.py
          python prophunter.py

      - name: Save card state
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A tip already published to Telegram MUST keep its message_id.
          # Commit history before pulling: stash/pop previously lost this
          # critical state if another harmless GitHub commit landed during send.
          python -m json.tool picks_history.json >/dev/null
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' picks_history.json; then
            echo "Refusing to commit conflicted picks_history.json"
            exit 1
          fi
          git add picks_history.json
          if git diff --staged --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "prop hunter card history $(date -u +%F-%H%M)"
          # The card collector may modify tracked cache/diagnostic files.
          # History is already committed above; discard only other unstaged
          # working-tree changes so rebase can safely publish Telegram IDs.
          git restore --worktree -- .
          git diff --quiet || { echo "Unexpected dirty worktree after history commit"; exit 1; }
          # Other workflows may update unrelated files while card sends.
          # Rebase committed history without stashing it or losing message IDs.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Card history and Telegram message IDs saved"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "CRITICAL: Telegram card history was not pushed"
          exit 1

