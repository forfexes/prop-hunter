name: Prop Hunter Autonomous

"on":
  workflow_dispatch: {}
  push:
    paths:
      - '.github/card-trigger'
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: prop-hunter-card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              raise SystemExit("Supabase preflight failed: SUPABASE_URL/SUPABASE_KEY missing")
          req = urllib.request.Request(
              f"{url}/rest/v1/prop_hunter_db_health?select=table_name,rows&limit=1",
              headers={"apikey": key},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f"Supabase preflight failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "ignore")[:300]
              raise SystemExit(f"Supabase preflight failed: HTTP {exc.code} {body}")
          except Exception as exc:
              raise SystemExit(f"Supabase preflight failed: {exc}")
          print("Supabase preflight OK")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Chromium is intentionally not installed on normal card runs.

      - name: Local integrity gate
        env:
          PH_EXPECTED_RUNTIME_VERSION: 13.10.1-KEYLESS-HARDENED
        run: |
          python -m compileall -q .
          python prop_hunter_runtime_guard.py

      - name: Fast source/bookmaker collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB,NBA,WNBA,NFL,NHL,NCAAB,NCAAF,EUROLEAGUE
          PH_KEYLESS_BOOKS_ENABLED: '1'
          PH_KEYLESS_BOOKS: draftkings,fanduel,bovada,betrivers
          PH_KEYLESS_TIMEOUT: '5'
          PH_KEYLESS_MAX_EVENTS: '3'
          PH_KEYLESS_MAX_PROP_CATEGORIES: '6'
          PH_KEYLESS_CACHE_TTL: '600'
          PH_KEYLESS_SOURCE_BUDGET_SEC: '18'
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          OPTICODDS_KEY: ${{ secrets.OPTICODDS_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          PH_ODDSPAPI_MAX_EVENTS: '2'
          PH_ODDSAPI_IO_MAX_EVENTS: '3'
          PH_ODDSAPI_IO_TIMEOUT: '6'
          PH_DIRECT_ROWS_PER_SPORT_TARGET: '50'
          PH_DIRECT_BOOK_TARGET: '5'
          PH_DIRECT_PAIR_TARGET: '15'
          PH_SOURCE_BUDGET_SEC: '165'
          PH_KAMBI_ENABLED: '1'
          PH_KAMBI_MAX_EVENTS: '3'
          PH_KAMBI_MAX_BRANDS: '4'
          PH_KAMBI_CACHE_TTL: '900'
          PH_KAMBI_BUDGET_SEC: '25'
          PH_KAMBI_TIMEOUT: '4'
          PH_1XBET_ENABLED: '1'
          PH_1XBET_MAX_EVENTS: '2'
          PH_1XBET_TIMEOUT: '4'
          PH_SGO_MAX_EVENTS: '4'
          PH_SGO_TIMEOUT: '6'
          PH_OPTICODDS_MAX_FIXTURES: '5'
          PH_OPTICODDS_TIMEOUT: '6'
          PH_OPTICODDS_BOOKS: DraftKings,FanDuel,BetMGM,Caesars,bet365
          PH_PARLAY_TIMEOUT: '6'
          PH_PARLAY_LIMIT: '5000'
          PH_PROPLINE_TIMEOUT: '6'
          PH_ODDSPAPI_MAX_ODDS_CALLS: '6'
          PH_FAST_BROWSER_BOOKS: bet365,betmgm,caesars,betrivers,fanatics,hardrock,thescore,betr,dabble,chalkboard,parlayplay
          PH_FAST_BROWSER_JOBS: '0'
          PH_SKIP_BLOCKED_FREE: '1'
          PH_BROWSER_ENABLED: '0'
          PH_BDL_MAX_GAMES: '4'
          PH_BDL_TIMEOUT: '5'
          PH_BDL_PROPS_ENABLED: '0'
        run: |
          if [ -f prop_hunter_source_orchestrator.py ]; then
            python prop_hunter_source_orchestrator.py --mode fast || echo "source orchestrator soft-fail; using in-engine collectors"
          else
            echo "source orchestrator absent; using in-engine collectors"
          fi

      - name: DATA cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          LAST_N_GAMES: '30'
        run: python prop_hunter_scraper.py || echo "DATA cache soft-fail; card continues"

      - name: Results, settlement and CLV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAST_N_GAMES: '30'
          PH_MLB_RESULTS_MAX_PLAYERS: '20'
          PH_MLB_EXTRA_RESULTS_MAX_PLAYERS: '20'
          NBA_RESULTS_PLAYER_CAP: '12'
          NBA_RESULTS_TIMEOUT: '5'
          WNBA_RESULT_GAME_CAP: '10'
          NFL_RESULTS_PLAYER_CAP: '80'
          NHL_RESULTS_PLAYER_CAP: '40'
          PH_NCAA_RESULTS_MAX_DATES: '4'
          PH_NCAA_RESULTS_MAX_EVENTS: '16'
          PH_NCAA_RESULT_LEAGUES: NCAAB,NCAAF
          PH_EUROLEAGUE_RESULTS_MAX_DATES: '4'
          PH_EUROLEAGUE_RESULTS_MAX_EVENTS: '16'
          HTTP_TIMEOUT: '8'
          PH_RESULTS_LOOKBACK_DAYS: '4'
          PH_RESULTS_FALLBACK_SUMMARY: '0'
          PH_RESULTS_HTTP_TIMEOUT: '8'
        run: |
          for f in prop_hunter_results_mlb.py prop_hunter_results_mlb_extras.py prop_hunter_results_nba.py prop_hunter_results_wnba.py prop_hunter_results_nfl.py prop_hunter_results_nhl.py prop_hunter_results_ncaa.py prop_hunter_results_euroleague.py; do
            if [ -f "$f" ]; then python "$f" || echo "$f soft-fail"; fi
          done
          python prop_hunter_settler.py || echo "settler soft-fail; card continues"
          python prop_hunter_settler_extras.py || echo "extra settler soft-fail; card continues"
          python prophunter_results.py || echo "inline reporter soft-fail; card continues"
          python prop_hunter_clv_engine.py || echo "CLV soft-fail; card continues"

      - name: Build and post card
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          OPTICODDS_KEY: ${{ secrets.OPTICODDS_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          PH_KEYLESS_BOOKS_ENABLED: '1'
          PH_SGO_DIRECT: '0'
          PH_ODDS_HTTP_TIMEOUT: '5'
          PH_AI_RETRY: '0'
          PH_BROWSER_ENABLED: '0'
          PH_BDL_MAX_GAMES: '4'
          PH_BDL_TIMEOUT: '5'
          PH_BDL_PROPS_ENABLED: '0'
        run: python prophunter.py

      - name: Save card state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add picks_history.json odds_cache.json ml_model.pkl prop_hunter_identity_cache.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter card $(date -u +%F-%H%M)"
          git push origin main
