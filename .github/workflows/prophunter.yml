sql
-- 1. PROP PICKS (Haupt-Picks Tabelle)
create table if not exists prop_picks (
  id bigserial primary key,
  date date not null,
  sport text,
  player text,
  team text,
  market text,
  direction text,
  line numeric,
  odds numeric,
  stake numeric default 1,
  emoji text,
  result text default 'pending',
  profit numeric default 0,
  dedup_key text,
  ev numeric,
  ml_prob numeric,
  created_at timestamptz default now(),
  unique(dedup_key, date)
);
alter table prop_picks disable row level security;

-- 2. AMERICAN PLAYER PROPS (vom Scraper)
create table if not exists american_player_props (
  id bigserial primary key,
  source text not null,
  sport text not null,
  event_id text not null,
  commence_time timestamptz,
  home_team text,
  away_team text,
  bookmaker text,
  bookmaker_title text,
  market_key text not null,
  market_last_update timestamptz,
  player_name text not null,
  selection text,
  line numeric,
  american_odds numeric,
  decimal_odds numeric,
  implied_probability numeric,
  raw jsonb,
  created_at_utc timestamptz,
  inserted_at timestamptz default now(),
  unique(source,sport,event_id,bookmaker,market_key,player_name,selection,line)
);
alter table american_player_props disable row level security;

-- 3. PLAYER STATS (für ML)
create table if not exists player_stats (
  id bigserial primary key,
  player_name text not null,
  sport text not null,
  game_date date,
  stat_key text,
  stat_value numeric,
  home_away text,
  opponent text,
  created_at timestamptz default now()
);
alter table player_stats disable row level security;

-- 4. ML PREDICTIONS (Logs)
create table if not exists ml_predictions (
  id bigserial primary key,
  date date,
  player text,
  sport text,
  market text,
  line numeric,
  direction text,
  ml_prob numeric,
  features jsonb,
  created_at timestamptz default now()
);
alter table ml_predictions disable row level security;
