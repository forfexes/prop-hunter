name: Prop Hunter AI Master V11

on:
  workflow_dispatch:
    inputs:
      run_ai_master:
        description: "Run AI Master V11 database modules"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      run_bot:
        description: "Run Telegram Prop Hunter bot"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      run_heavy_backfill:
        description: "Run heavy backfills/statcast"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

  schedule:
    - cron: "0 */6 * * *"

jobs:
  prop-hunter-ai-master:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_data_plus.txt ]; then pip install -r requirements_data_plus.txt; fi
          python -m playwright install chromium || true

      - name: Compile Python
        run: python -m py_compile *.py

      - name: DATA+ scraper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
        run: |
          if [ -f prop_hunter_scraper.py ]; then python prop_hunter_scraper.py; else echo "prop_hunter_scraper.py missing - skipped"; fi

      - name: History scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HISTORY_BATCH_SIZE: 75
          HISTORY_PLAYER_CAP: 220
          HISTORY_LAST_N_GAMES: 30
        run: |
          if [ -f prop_hunter_history_scraper.py ]; then python prop_hunter_history_scraper.py; else echo "history scraper missing - skipped"; fi

      - name: AI Master V11
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai_master == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
        run: |
          if [ -f prop_hunter_ai_master_v11.py ]; then python prop_hunter_ai_master_v11.py; else echo "AI Master missing - skipped"; fi

      - name: Heavy backfills
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heavy_backfill == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -f prop_hunter_statcast_backfill.py ]; then python prop_hunter_statcast_backfill.py; else echo "statcast missing - skipped"; fi
          if [ -f prop_hunter_retrosheet_import.py ]; then python prop_hunter_retrosheet_import.py; else echo "retrosheet missing - skipped"; fi

      - name: Run Prop Hunter
        if: ${{ github.event_name == 'schedule' || inputs.run_bot == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI: ${{ secrets.ODDSPAPI }}
          PH_EVENT_PROPS_LIVE: "1"
          PH_EVENT_PROPS_MIN_ROWS: "300"
          PH_EVENT_PROPS_SUPABASE_LIMIT: "5000"
          PH_EVENT_PROPS_EVENT_LIMIT: "20"
        run: test -f prophunter.py && python prophunter.py
