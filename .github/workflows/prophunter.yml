name: Prop Hunter Autonomous

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'
    - cron: '30 16 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: prop-hunter-card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt


      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              raise SystemExit("Supabase preflight failed: SUPABASE_URL/SUPABASE_KEY missing")
          req = urllib.request.Request(
              f"{url}/rest/v1/prop_hunter_db_health?select=table_name,rows&limit=1",
              headers={"apikey": key},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f"Supabase preflight failed: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "ignore")[:300]
              raise SystemExit(f"Supabase preflight failed: HTTP {exc.code} {body}")
          except Exception as exc:
              raise SystemExit(f"Supabase preflight failed: {exc}")
          print("Supabase preflight OK")
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Local integrity gate
        env:
          PH_EXPECTED_RUNTIME_VERSION: 13.6-ODDSPLUS
        run: |
          python -m compileall -q .
          python prop_hunter_runtime_guard.py

      - name: Fast source/bookmaker collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB,NBA,WNBA,NFL,NHL
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PH_ODDSPAPI_MAX_EVENTS: '2'
          PH_ODDSPAPI_MAX_ODDS_CALLS: '6'
          PH_FAST_BROWSER_BOOKS: bet365,betmgm,caesars,betrivers,fanatics,hardrock,thescore,betr,dabble,chalkboard,parlayplay
          PH_FAST_BROWSER_JOBS: '6'
        run: |
          if [ -f prop_hunter_source_orchestrator.py ]; then python prop_hunter_source_orchestrator.py --mode fast; else echo "source orchestrator absent; using in-engine collectors"; fi

      - name: DATA and history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          LAST_N_GAMES: '30'
        run: |
          python prop_hunter_scraper.py
          python prop_hunter_history_scraper.py

      - name: Public snapshot connectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB,NBA,WNBA,NFL,NHL
        run: |
          if [ -f prop_hunter_odds_pp_ud.py ]; then python prop_hunter_odds_pp_ud.py || echo "connector soft-fail"; else echo "public connector absent; skip"; fi

      - name: Build and post card
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python prophunter.py

      - name: Save card state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks_history.json odds_cache.json ml_model.pkl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter card $(date -u +%F-%H%M)"
          git push
