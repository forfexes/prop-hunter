name: Prop Hunter NBA Usage Source Check
"on":
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/prop_hunter_nba_usage.yml"
      - "prop_hunter_nba_usage.py"
      - "prop_hunter_nba_usage_test.py"
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install nba_api requests
      - name: Official NBA Usage API smoke test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from prop_hunter_nba_usage import safe_fetch_season_usage
          now=datetime.now(timezone.utc)
          start=now.year if now.month>=10 else now.year-1
          season=f"{start}-{str(start+1)[-2:]}"
          from prop_hunter_nba_usage import safe_fetch_season_usage
          rows=safe_fetch_season_usage(season,timeout=12)
          if not rows:
              print("NBA official usage source UNAVAILABLE: no USG% imported; no synthetic values")
          else:
              print(f"NBA official usage source OK: season={season}, players={len(rows)}")
          PY
