name: NBA Premium Only Guard

on:
  push:
    paths:
      - 'prop_hunter_image_cards.py'
      - 'prop_hunter_nba_premium_adapter.py'
      - 'test_prop_hunter_premium_only.py'
      - 'prop_hunter_image_cards_test.py'
      - 'prop_hunter_nba_premium_adapter_test.py'
      - 'card_templates/nba_premium_v2/**'
      - '.github/workflows/prophunter.yml'
      - '.github/workflows/prophunter_results.yml'
      - '.github/workflows/nba_premium_only_guard.yml'
  pull_request:
    paths:
      - 'prop_hunter_image_cards.py'
      - 'prop_hunter_nba_premium_adapter.py'
      - 'prop_hunter_nba_premium_adapter_test.py'
      - 'test_prop_hunter_premium_only.py'
      - 'prop_hunter_image_cards_test.py'
      - 'card_templates/nba_premium_v2/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  premium-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest pillow requests cairosvg
      - name: Verify old card renderer is never called
        run: python -m pytest -q test_prop_hunter_premium_only.py prop_hunter_image_cards_test.py prop_hunter_nba_premium_adapter_test.py
      - name: Confirm real send AND settlement rebuild up-to-date premium artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from card_templates.nba_premium_v2.build_masters import build
          import xml.etree.ElementTree as ET
          for file in ('.github/workflows/prophunter.yml',
                       '.github/workflows/prophunter_results.yml'):
              text=Path(file).read_text(encoding='utf-8')
              assert 'Regenerate current NBA premium masters' in text, file
              assert 'from card_templates.nba_premium_v2.build_masters import build' in text, file
              assert "PH_NBA_PREMIUM_V2_REQUIRE: '1'" in text, file
          manifest=build()
          assert manifest['template_count']==52
          single=(Path('card_templates/nba_premium_v2')/'single_points.svg').read_text()
          lottery=(Path('card_templates/nba_premium_v2')/'lottery_3.svg').read_text()
          ET.fromstring(single)
          ET.fromstring(lottery)
          assert 'PRO TIP — SINGLE' in single, 'outdated single headline'
          assert 'url(#purple)' in lottery, 'lottery is missing original purple theme'
          print('Production card and settlement will use latest 52 SVG masters')
          PY
      - name: Require four NBA QA preview cards
        run: |
          for family in single ladder builder lottery; do
            test -s "output/nba_premium_qa/${family}.png" || exit 1
          done
      - name: Expose QA-only preview thumbnails for actual visual inspection
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64,io
          for family in ('single','ladder','builder','lottery'):
              path=Path('output/nba_premium_qa')/(family+'.png')
              with Image.open(path) as source:
                  thumb=source.convert('RGB')
                  thumb.thumbnail((420,560),Image.Resampling.LANCZOS)
                  out=io.BytesIO()
                  thumb.save(out,'JPEG',quality=52,optimize=True)
              print('NBA_PREMIUM_VISUAL_THUMB '+family+' '+
                    base64.b64encode(out.getvalue()).decode('ascii'))
          print('Synthetic QA only: not a Telegram publication or owner pixel-match approval')
          PY
      - name: Upload NBA QA preview cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-premium-qa-four-card-families
          path: output/nba_premium_qa/*.png
          if-no-files-found: warn
          retention-days: 7
