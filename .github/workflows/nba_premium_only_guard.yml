name: NBA Premium Only Guard

on:
  push:
    paths:
      - 'prop_hunter_image_cards.py'
      - 'prop_hunter_nba_premium_adapter.py'
      - 'test_prop_hunter_premium_only.py'
      - '.github/workflows/nba_premium_only_guard.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  premium-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest pillow requests
      - name: Verify old card renderer is never called
        run: python -m pytest -q test_prop_hunter_premium_only.py
