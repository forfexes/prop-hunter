name: Prop Hunter Source Watcher

"on":
  workflow_dispatch: {}
  schedule:
    # GitHub cron is UTC. Cheap source discovery: twice monthly only.
    - cron: '17 4 1,15 * *'

permissions:
  contents: write

concurrency:
  group: prop-hunter-source-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile watcher
        run: python -m py_compile prop_hunter_github_watcher.py

      - name: Discover new sports-data projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PH_WATCHER_MIN_SCORE: '50'
          PH_WATCHER_MAX_PER_QUERY: '15'
          PH_WATCHER_MAX_ALERTS: '10'
        run: python prop_hunter_github_watcher.py

      - name: Save watcher state/report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prop_hunter_github_watch_state.json prop_hunter_github_watch_report.json
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter source watch $(date -u +%F)"
          git pull --rebase
          git push
