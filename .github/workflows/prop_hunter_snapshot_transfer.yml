name: Prop Hunter Safe Snapshot Transfer
"on":
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/prop_hunter_snapshot_transfer.yml"
permissions:
  contents: read
concurrency:
  group: prop-hunter-snapshot-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate migration source
        run: python -m py_compile prop_hunter_snapshot_migrate.py
      - name: Install pinned transport
        run: python -m pip install requests==2.32.5
      - name: Transfer every original snapshot and verify independently
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
        run: python prop_hunter_snapshot_migrate.py
      - name: Keep verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-snapshot-transfer-proof
          path: prop_hunter_snapshot_migration_report.json
          retention-days: 30
