name: Prop Hunter TG Delete
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "message ids, comma separated"
        default: ""
jobs:
  del:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDS: ${{ inputs.ids }}
        run: |
          for i in ${IDS//,/ }; do
            echo "$i: $(curl -s -X POST "https://api.telegram.org/bot$T/deleteMessage" -d chat_id="$C" -d message_id="$i")"
          done
