name: PROP HUNTER Formula Merge QA
"on":
  pull_request:
    branches: [main]
    paths:
      - prop_hunter_combo_prices.py
      - premium_joint_formula.py
      - prophunter_core_1391.py
      - prop_hunter_image_publication_gate.py
      - test_prop_hunter_combo_formula_integration.py
      - .github/workflows/prop_hunter_formula_merge_qa.yml
  push:
    branches: [qa/formula-before-ticket-gate]
permissions:
  contents: read
jobs:
  offline-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile prop_hunter_combo_prices.py premium_joint_formula.py prophunter_core_1391.py
      - run: python -m pytest -q test_prop_hunter_combo_formula_integration.py
