name: Prop Hunter Matchup Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests nba_api
      - run: |
          python - <<'P'
          from prop_hunter_matchup import _ranked
          for sp in ("NBA","WNBA","NHL","NFL","MLB"):
              r=_ranked(sp); print(sp,"teams",len(r), list(r.items())[:1])
          P
