name: Prop Hunter Matchup Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests nba_api
      - run: |
          python - <<'P'
          from prop_hunter_matchup import _ranked, team_abbr, matchup_rating
          for sp in ("NBA","WNBA","NHL","NFL"):
              r=_ranked(sp); print("RESULT",sp,"teams",len(r), list(r.items())[:1])
          for t in ("Houston Rockets","Washington Wizards","Toronto Maple Leafs","Detroit Lions"):
              print("RESULT abbr",t,team_abbr(t))
          print("RESULT rating", matchup_rating("NBA", team_abbr("Washington Wizards"), "rebounds","over"))
          P
