name: Debug Odds API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Odds API quota + WNBA events
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "=== QUOTA CHECK ==="
          curl -s "https://api.the-odds-api.com/v4/sports?apiKey=$ODDS_API_KEY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,list):
              print(f'Sports available: {len(d)}')
              wnba=[x for x in d if 'wnba' in x.get('key','').lower()]
              print(f'WNBA in plan: {wnba}')
          else:
              print('Error:', d)
          " || echo "quota check failed"

          echo ""
          echo "=== WNBA EVENTS ==="
          curl -sv "https://api.the-odds-api.com/v4/sports/basketball_wnba/events?apiKey=$ODDS_API_KEY" 2>&1 | grep -E "< x-requests|< HTTP|^\{|\[" | head -20

          echo ""
          echo "=== MLB EVENTS ==="
          curl -sv "https://api.the-odds-api.com/v4/sports/baseball_mlb/events?apiKey=$ODDS_API_KEY" 2>&1 | grep -E "< x-requests|< HTTP|^\[" | head -10

          echo ""
          echo "=== NBA EVENTS ==="
          curl -sv "https://api.the-odds-api.com/v4/sports/basketball_nba/events?apiKey=$ODDS_API_KEY" 2>&1 | grep -E "< x-requests|< HTTP|^\[" | head -10
