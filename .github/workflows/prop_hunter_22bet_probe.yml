name: Prop Hunter 22bet Source Probe
"on":
  workflow_dispatch: {}
  push:
    paths:
      - 'prop_hunter_22bet_probe.py'
      - 'prop_hunter_22bet_points.py'
      - 'prop_hunter_22bet_points_test.py'
      - '.github/workflows/prop_hunter_22bet_probe.yml'
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Verify 22bet points parser
        run: python prop_hunter_22bet_points_test.py
      - name: Probe NBA NHL NFL
        run: python prop_hunter_22bet_probe.py
