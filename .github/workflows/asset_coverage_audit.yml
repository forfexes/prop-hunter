name: Asset Coverage Audit (prop) - Read Only
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "asset_coverage_audit.py"
      - "test_asset_coverage_rotation.py"
      - "test_prop_hunter_asset_identity.py"
      - "prop_hunter_asset_identity.py"
      - "prop_hunter_image_cards.py"
      - ".github/workflows/asset_coverage_audit.yml"
  schedule:
    - cron: '21 4 * * *'

permissions:
  contents: read

concurrency:
  group: asset-coverage-audit-prop
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --quiet requests==2.32.5 Pillow==11.3.0 numpy==2.3.2
      - name: Syntax gate, no Telegram
        run: |
          python -m py_compile asset_coverage_audit.py test_asset_coverage_rotation.py test_prop_hunter_asset_identity.py prop_hunter_asset_identity.py prop_hunter_image_cards.py
          python -m unittest -v test_asset_coverage_rotation.py test_prop_hunter_asset_identity.py
      - name: Inventory complete names and verify real images on prioritized samples
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
          ASSET_MAX_PHOTOS: '100'
          ASSET_MAX_TEAMS: '120'
        run: python -u asset_coverage_audit.py --bot prop --max-photos 100 --max-teams 120 --rotate
      - name: Upload private-data-minimized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-coverage-audit-prop
          path: diagnostics/asset_coverage_audit.json
          if-no-files-found: warn
          retention-days: 7
