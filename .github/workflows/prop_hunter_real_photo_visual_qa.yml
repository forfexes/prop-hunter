name: PROP HUNTER Real Photo & Logo Visual QA (No Telegram)

"on":
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/prop_hunter_real_photo_visual_qa.yml'
      - 'prop_hunter_owner_supplied_single.py'
      - 'prop_hunter_owner_clean_single.py'
      - 'prop_hunter_original_compositor.py'
      - 'prop_hunter_owner_clean_ladder.py'
      - 'prop_hunter_owner_clean_builder.py'
      - 'prop_hunter_owner_clean_lottery.py'
      - 'prop_hunter_image_cards.py'
      - 'card_templates/owner_supplied/**'
      - 'card_templates/approved/**'
permissions:
  contents: read
jobs:
  real-image-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline image inspection dependencies
        run: python -m pip install --quiet pillow requests numpy
      - name: Probe REAL sourced NBA player photos and correct team crests
        run: |
          python - <<'PY'
          import io, json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageChops
          import prop_hunter_image_cards as cards
          from prop_hunter_nba_premium_adapter import _photo
          from prop_hunter_original_compositor import _source
          from prop_hunter_owner_supplied_single import (
              _plate as latest_single_plate,
              _portrait as latest_single_portrait,
              _logo as latest_single_logo,
          )

          out=Path("output/real_photo_visual_qa")
          out.mkdir(parents=True,exist_ok=True)
          league=cards.LEAGUES["nba"]
          actual_name=None
          player=None
          for name in ("Jrue Holiday","LeBron James","Stephen Curry","Nikola Jokic"):
              candidate=cards.player_photo(name,league)
              if candidate is None:
                  print("QA_REAL_PHOTO_UNAVAILABLE",name)
                  continue
              try:
                  _photo(candidate,"player_photo")
              except ValueError as exc:
                  print("QA_PHOTO_CUTOUT_REJECTED",name,str(exc)[:90])
                  continue
              actual_name=name
              player=candidate
              break
          logos=[cards.team_logo(name,league) for name in
                 ("Boston Celtics","New York Knicks")]
          if cards._same_visible_team_crest([
                  ("Boston Celtics",logos[0]),("New York Knicks",logos[1])]):
              raise SystemExit("Wrong provider: both NBA team crests identical")
          evidence={
              "source":"ESPN public team/player image APIs",
              "player":actual_name,
              "player_cutout":player is not None,
              "home_logo":logos[0] is not None,
              "away_logo":logos[1] is not None,
              "quote":"NONE - QA, NOT A TIP",
              "telegram":"DISABLED",
          }
          (out/"evidence.json").write_text(json.dumps(evidence,indent=2))
          print("QA_REAL_IMAGE_EVIDENCE",evidence)
          if player is None or any(logo is None for logo in logos):
              raise SystemExit("Authentic NBA portrait/logo gate not ready")
          # Every betting detail is explicitly EMPTY: there is no invented
          # sportsbook quote, fixture, kickoff, tip probability or result.
          # Actual newest 22.11 source: render ONLY the authentic image
          # components. No fake fixture, bookmaker quote, time or pick line
          # is provided to the production-only owner renderer.
          source=latest_single_plate()
          original=source.copy()
          latest_single_portrait(source,player)
          latest_single_logo(source,("Boston Celtics",logos[0]),191)
          latest_single_logo(source,("New York Knicks",logos[1]),322)
          # Real sports assets are allowed ONLY in their dynamic slots.
          # The owner's PROP HUNTER masthead and NBA shield stay literally
          # pixel-identical, not AI-drawn or pasted over.
          for box in ((140,2,385,64),(12,2,58,55)):
              if ImageChops.difference(
                  original.crop(box),source.crop(box)).getbbox():
                  raise SystemExit("Actual original PROP HUNTER/NBA logo altered")
          print("REAL_ASSET_OWNER_STATIC_LOGOS_PIXEL_IDENTICAL")
          image=source.convert("RGB")
          d=ImageDraw.Draw(image)
          d.text((38,image.height-35),"OFFLINE BILDKONTROLLE · KEINE WETTE",
                 fill="#FFD966")
          image.save(out/"real_photo_original_single_QA.png")
          print("REAL_PHOTO_OWNER_SINGLE_RENDERED_NO_TELEGRAM")
          from prop_hunter_owner_clean_ladder import render as render_ladder
          from prop_hunter_owner_clean_builder import render as render_builder

          # All additional portraits are real independently sourced ESPN NBA
          # headshots with transparency checks. All betting lines below are
          # visually marked QA-only; they are NEVER sent to Telegram.
          actual_athletes=[(actual_name,player)]
          for name in ("LeBron James","Stephen Curry","Nikola Jokic",
                       "Luka Doncic","Jayson Tatum","Giannis Antetokounmpo",
                       "Kevin Durant","Devin Booker","Anthony Edwards"):
              candidate=cards.player_photo(name,league)
              if candidate is None:
                  continue
              try:
                  _photo(candidate,"player_photo")
              except ValueError:
                  continue
              actual_athletes.append((name,candidate))
              if len(actual_athletes)>=6:
                  break
          evidence["real_alpha_players"]=[name for name,_ in actual_athletes]
          (out/"evidence.json").write_text(json.dumps(evidence,indent=2))
          if len(actual_athletes)<6:
              raise SystemExit("Insufficient real photo cutouts for 6-leg Builder/Lottery QA")

          def save_qa(label,blob):
              with Image.open(io.BytesIO(blob)) as src:
                  verified=src.convert("RGB")
              ImageDraw.Draw(verified).text((38,verified.height-36),
                  "OFFLINE QA ONLY - NO REAL ODDS, FIXTURE OR TELEGRAM",
                  fill="#FFD966")
              verified.save(out/(label+"_real_photos_QA.png"))

          home_away=[("Boston Celtics",logos[0]),("New York Knicks",logos[1])]
          ladder_rows=[
              {"name":actual_name,"photo":player,
               "label":f"QA STAGE {i+1}","odds":"@—","form":""}
              for i in range(5)]
          save_qa("ladder5",render_ladder(_source("ladder"),
              subtitle="",teams=home_away,rows=ladder_rows,
              footer="",settlement="QA ONLY"))
          builder_rows=[
              {"name":name,"photo":photo,
               "label":"QA MARKET","odds":"@—","form":""}
              for name,photo in actual_athletes[:6]]
          save_qa("builder6",render_builder(_source("builder"),
              subtitle="",teams=home_away,rows=builder_rows,
              footer="KEINE BUCHMACHERQUOTE · QA ONLY",settlement="QA ONLY"))
          # Lottery's PRODUCTION renderer rightly requires a genuine
          # combined ticket price and verified independent fixtures.
          # In photo-only QA, exercise its true image geometry WITHOUT
          # inventing either a quote, a match or a kickoff.
          from prop_hunter_owner_clean_lottery import _extended
          from prop_hunter_original_compositor import _background_portrait
          lottery_frame,extra=_extended(_source("lottery"),len(builder_rows))
          if not _background_portrait(lottery_frame,actual_athletes[0][1],
                                     (0,148,199,321)):
              raise SystemExit("Lottery original hero portrait cannot fit")
          first_y=342+max(0,(295-len(builder_rows)*85)//2)
          for i,(_,cutout) in enumerate(actual_athletes[:len(builder_rows)]):
              y=first_y+i*85
              if not _background_portrait(lottery_frame,cutout,
                                          (50,y+6,97,y+75)):
                  raise SystemExit("Lottery original athlete portrait cannot fit")
          out_image=lottery_frame.convert("RGB")
          ImageDraw.Draw(out_image).text((38,out_image.height-36),
              "ONLY REAL PHOTOS · NO GAME / NO BOOKMAKER ODDS / NO TELEGRAM",
              fill="#FFD966")
          out_image.save(out/"lottery6_real_photos_QA.png")
          print("ALL_FOUR_OWNER_FAMILIES_REAL_ASSET_SLOTS_PASS")
          print("LOTTERY_FULL_TICKET_NOT_VERIFIED_NO_OBSERVED_QUOTE")
          PY
      - name: Export image and no-bookmaker QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-owner-authentic-photo-visual-QA-only
          path: output/real_photo_visual_qa/
          if-no-files-found: warn
          retention-days: 2
