name: Prop Hunter EuroLeague Data

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '35 6 * * *'
  push:
    paths:
      - 'prop_hunter_backfill_euroleague.py'
      - 'prop_hunter_backfill_euroleague_test.py'
      - 'prop_hunter_feature_builder.py'
      - '.github/euroleague-data-trigger'

permissions:
  contents: read

concurrency:
  group: prop-hunter-euroleague-data
  cancel-in-progress: false

jobs:
  euroleague-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_results.txt
      - name: Install
        run: pip install -r requirements_results.txt
      - name: Regression
        run: |
          python -m py_compile prop_hunter_backfill_euroleague.py prop_hunter_results_euroleague.py prop_hunter_gamelog_retention.py prop_hunter_feature_builder.py
          python prop_hunter_euroleague_test.py
          python prop_hunter_backfill_euroleague_test.py
      - name: Backfill EuroLeague and rebuild features
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PH_EUROLEAGUE_LAST_N: '40'
          PH_EUROLEAGUE_BACKFILL_DAYS: '400'
          PH_EUROLEAGUE_MAX_EVENTS: '450'
          PH_EUROLEAGUE_INCREMENTAL_DAYS: '7'
          PH_EUROLEAGUE_INCREMENTAL_MAX_EVENTS: '40'
          PH_GAMELOG_KEEP_PER_PLAYER: '40'
          PH_FEATURE_LEAGUE: 'EUROLEAGUE'
          PH_FEATURE_WRITE_BATCH: '400'
        run: |
          python prop_hunter_backfill_euroleague.py
          python prop_hunter_gamelog_retention.py --apply
          python prop_hunter_feature_builder.py
