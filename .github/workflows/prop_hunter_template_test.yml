name: PROP HUNTER Original Template and Ladder Check

"on":
  workflow_dispatch: {}
  push:
    paths:
      - 'prop_hunter_image_cards.py'
      - 'prop_hunter_original_compositor.py'
      - 'prop_hunter_original_template_registry.py'
      - 'prop_hunter_poster_families_test.py'
      - 'test_prop_hunter_league_template_isolation.py'
      - 'prop_hunter_media_settlement_test.py'
      - 'prop_hunter_card_only_targeted_test.py'
      - '.github/workflows/prop_hunter_template_test.yml'

permissions:
  contents: read

jobs:
  render-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: python -m pip install pillow requests numpy
      - name: Validate single-player Ladder and sport/format routing
        run: |
          python -m py_compile prop_hunter_original_compositor.py prop_hunter_image_cards.py prop_hunter_original_template_registry.py prop_hunter_poster_families_test.py test_prop_hunter_league_template_isolation.py
          python prop_hunter_poster_families_test.py
          python test_prop_hunter_league_template_isolation.py
          python prop_hunter_media_settlement_test.py
          python prop_hunter_card_only_targeted_test.py
      - name: Save all rendered test cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-card-qa
          path: poster_previews/*.png
          if-no-files-found: warn
          retention-days: 3
