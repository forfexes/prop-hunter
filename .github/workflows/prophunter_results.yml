name: Prop Hunter Results

on:
  schedule:
    - cron: '0 10 * * *'   # 12:00 CEST (Auswertung vom Vortag)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run Results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python prophunter_results.py

      - name: Save updated history
        run: |
          git config user.name "prophunter-bot"
          git config user.email "bot@prophunter.local"
          git add picks_history.json || true
          git commit -m "results $(date +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"
