name: Prop Hunter Results Autonomous

"on":
  workflow_dispatch: {}
  push:
    paths:
      - 'prop_hunter_settler.py'
      - 'prop_hunter_shared_utils.py'
      - 'prophunter_results.py'
      - 'prophunter_core_1391.py'
      - 'prop_hunter_builder_engine.py'
      - 'prop_hunter_quality_gates_test.py'
      - 'prop_hunter_settler_fast_test.py'
      - 'prop_hunter_form_windows.py'
      - 'prop_hunter_form_windows_test.py'
      - 'prop_hunter_results_nba.py'
      - 'prop_hunter_results_mlb.py'
      - 'prop_hunter_results_wnba.py'
      - 'prop_hunter_results_nfl.py'
      - 'prop_hunter_results_nhl.py'
      - 'prop_hunter_team_settler.py'
      - 'prop_hunter_team_settler_test.py'
      - 'prop_hunter_results_euroleague.py'
      - '.github/results-trigger'
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: write

# Serialize every workflow that writes picks_history.json.  Card generation and
# settlement must never rebase/autostash the same history file concurrently.
concurrency:
  group: prop-hunter-history-writer
  cancel-in-progress: false

# Explicit repair replay reuses already fetched official logs and rebuilt L15.
env:
  PH_WNBA_REFRESH: ${{ contains(github.event.head_commit.message, '[wnba-refresh]') && '1' || '0' }}
  PH_SETTLEMENT_REPLAY: ${{ contains(github.event.head_commit.message, '[settlement-replay]') && '1' || '0' }}

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Acquire the shared writer slot before reading the latest runtime.
          # A queued push SHA may predate the preceding writer's saved history.
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_results.txt

      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_KEY", "")
          if not url or not key:
              raise SystemExit("Supabase preflight failed: SUPABASE_URL/SUPABASE_KEY missing")
          # Keep preflight deliberately cheap. prop_hunter_db_health can aggregate
          # large tables and has previously hit Postgres statement_timeout, which
          # must not block the entire settlement pipeline.
          import time
          req = urllib.request.Request(
              f"{url}/rest/v1/prop_hunter_results?select=result_id&limit=1",
              headers={"apikey": key},
          )
          last = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      if response.status == 200:
                          print("Supabase preflight OK")
                          break
                      last = f"HTTP {response.status}"
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "ignore")[:300]
                  last = f"HTTP {exc.code} {body}"
              except Exception as exc:
                  last = str(exc)
              if attempt < 2:
                  time.sleep(3 * (attempt + 1))
          else:
              raise SystemExit(f"Supabase preflight failed after 3 attempts: {last}")
          PY

      - name: Install
        run: pip install -r requirements_results.txt

      - name: Compile and offline settlement regression
        run: |
          python -m py_compile prophunter_results.py prop_hunter_shared_utils.py prop_hunter_settler.py prop_hunter_settler_extras.py prop_hunter_feature_builder.py prop_hunter_gamelog_retention.py
          python -m py_compile prop_hunter_results_mlb.py prop_hunter_results_mlb_extras.py prop_hunter_results_nba.py prop_hunter_results_wnba.py prop_hunter_results_nfl.py prop_hunter_results_nhl.py prop_hunter_results_ncaa.py prop_hunter_results_euroleague.py
          python -m py_compile prop_hunter_learning_update.py prop_hunter_source_manager.py prop_hunter_model_registry.py
          python -m py_compile prop_hunter_coverage_watchdog.py prop_hunter_market_discovery.py prop_hunter_identity_hub.py prop_hunter_expansion_test.py prop_hunter_euroleague_test.py
          python prop_hunter_combo_prices_test.py
          python prop_hunter_quote_incidents_test.py
          python prop_hunter_market_regression_test.py
          python prop_hunter_expansion_test.py
          python prop_hunter_euroleague_test.py
          python prop_hunter_settler_fast_test.py
          python prop_hunter_settlement_backlog_test.py
          python prop_hunter_nba_api_test.py
          python prop_hunter_scan_dates_test.py
          python prop_hunter_team_settler_test.py
          python prop_hunter_snapshot_retention_test.py
          python prop_hunter_daily_control.py --check
          python prop_hunter_gamelog_retention_test.py
          python prop_hunter_basketball_boxscore_test.py
          python prop_hunter_binary_enrichment_test.py
          python prop_hunter_form_windows_test.py

      - name: Fetch official results and gamelogs
        if: env.PH_SETTLEMENT_REPLAY != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PH_MLB_RESULTS_MAX_PLAYERS: '80'
          PH_MLB_EXTRA_RESULTS_MAX_PLAYERS: '40'
          NBA_RESULTS_PLAYER_CAP: '24'
          NBA_RESULTS_TIMEOUT: '5'
          NBA_ESPN_MAX_DATES: '5'
          NBA_ESPN_MAX_EVENTS: '12'
          WNBA_RESULTS_MAX_DATES: '120'
          WNBA_RESULT_GAME_CAP: '120'
          NFL_RESULTS_PLAYER_CAP: '100'
          NHL_RESULTS_PLAYER_CAP: '60'
          PH_NCAA_RESULTS_MAX_DATES: '5'
          PH_NCAA_RESULTS_MAX_EVENTS: '24'
          PH_NCAA_RESULT_LEAGUES: NCAAB,NCAAF
          PH_EUROLEAGUE_RESULTS_MAX_DATES: '5'
          PH_EUROLEAGUE_RESULTS_MAX_EVENTS: '20'
          HTTP_TIMEOUT: '8'
        run: |
          failures=0
          run_collector() {
            name="$1"; shift
            echo "::group::Collector: $name"
            "$@"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::Collector $name failed with exit code $rc; continuing other sources"
              failures=1
            fi
          }
          run_collector MLB python prop_hunter_results_mlb.py
          run_collector MLB-extras python prop_hunter_results_mlb_extras.py
          run_collector NBA python prop_hunter_results_nba.py
          run_collector WNBA python prop_hunter_results_wnba.py
          run_collector NFL python prop_hunter_results_nfl.py
          run_collector NHL python prop_hunter_results_nhl.py
          run_collector NCAA python prop_hunter_results_ncaa.py
          run_collector EuroLeague python prop_hunter_results_euroleague.py
          if [ -f espn_multisport_results.py ]; then
            run_collector ESPN-multisport python espn_multisport_results.py
          fi
          if [ "$failures" -ne 0 ]; then
            echo "PH_COLLECTOR_FAILURE=1" >> "$GITHUB_ENV"
          fi

      - name: Refresh completed WNBA games for targeted repair
        if: contains(github.event.head_commit.message, '[wnba-refresh]')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python prop_hunter_results_wnba.py

      - name: Settle and publish evaluation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PH_RESULTS_LOOKBACK_DAYS: '4'
          PH_RESULTS_FALLBACK_SUMMARY: '0'
          PH_RESULTS_HTTP_TIMEOUT: '8'
        run: |
          python prop_hunter_quote_incidents.py
          python prop_hunter_settler.py
          python prop_hunter_settler_extras.py
          python prop_hunter_team_settler.py
          # Preserve freshly backfilled historical games until both settlers finish.
          if [ "$PH_SETTLEMENT_REPLAY" != "1" ] || [ "$PH_WNBA_REFRESH" = "1" ]; then
            PH_GAMELOG_KEEP_PER_PLAYER=15 python prop_hunter_gamelog_retention.py --apply
            python prop_hunter_feature_builder.py
          fi
          python prophunter_results.py
          python prop_hunter_pending_audit.py

      - name: Learn from settled picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python prop_hunter_learning_update.py
          python prop_hunter_model_registry.py
          python prop_hunter_coverage_watchdog.py || true
          python prop_hunter_market_discovery.py || true

      - name: Save results and learning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Runtime files are intentionally modified before this step.
          # Stash them before rebasing, then restore them after the branch is current.
          git stash push -u -m prop-hunter-results-runtime
          git pull --rebase origin main
          git stash pop || {
            echo "Runtime state changed upstream; preserving this serialized results run"
            # After stash pop, --theirs is the freshly generated stashed runtime
            # version. The shared concurrency group guarantees this job is the
            # sole results writer, so keep it for history and generated reports.
            for f in picks_history.json prop_hunter_autolearn_report.json prop_hunter_builder_correlations.json prop_hunter_coverage_report.json prop_hunter_market_discovery.json prop_hunter_model_registry.json prop_hunter_source_trust.json prop_hunter_pending_audit.json; do
              if git ls-files -u -- "$f" | grep -q .; then git checkout --theirs -- "$f"; git add "$f"; fi
            done
            git diff --name-only --diff-filter=U | grep -q . && exit 1 || true
          }
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' picks_history.json; then
            echo "Refusing to commit conflicted picks_history.json"
            exit 1
          fi
          python -m json.tool picks_history.json >/dev/null
          git add picks_history.json prop_hunter_model_registry.json prop_hunter_autolearn_report.json prop_hunter_builder_correlations.json prop_hunter_source_trust.json \
            prop_hunter_coverage_report.json prop_hunter_market_discovery.json prop_hunter_identity_cache.json prop_hunter_pending_audit.json ml_model.pkl 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter results $(date -u +%F)"
          git push origin main

      - name: Fail visibly when any results collector failed
        if: always()
        run: |
          if [ "${PH_COLLECTOR_FAILURE:-0}" = "1" ]; then
            echo "::error::One or more results collectors failed; inspect collector groups above."
            exit 1
          fi
