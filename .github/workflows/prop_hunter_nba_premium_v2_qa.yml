name: PROP HUNTER NBA Premium V2 Master QA
"on":
  push:
    paths:
      - 'card_templates/nba_premium_v2/**'
      - 'prop_hunter_nba_premium_adapter.py'
      - 'prop_hunter_nba_premium_adapter_test.py'
      - 'prop_hunter_image_cards.py'
      - '.github/workflows/prop_hunter_nba_premium_v2_qa.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nba-premium-master-writer
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install 'Pillow>=10' 'cairosvg>=2.7' 'requests>=2.31' 'numpy>=1.26'
      - name: Regenerate 52 editable SVG masters and preserve original NBA logo
        run: |
          python -u card_templates/nba_premium_v2/build_masters.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card_templates/nba_premium_v2/*.svg card_templates/nba_premium_v2/manifest.json card_templates/nba_premium_v2/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate 52 NBA premium masters with real NBA logo [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Test all 52 premium layered masters and strict bookmaker safety
        run: python -u card_templates/nba_premium_v2/test_masters.py
      - name: Test live-data adapter offline (no Telegram posts)
        run: python -u prop_hunter_nba_premium_adapter_test.py
      - name: Render eight clean visual previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'card_templates/nba_premium_v2')
          from render_cards import render_png
          out=Path('diagnostics/nba_premium_v2')
          out.mkdir(parents=True,exist_ok=True)
          for key in ('single_single','ladder_4','builder_4','builder_6','same_player_4','combo_5','lottery_6','longshot'):
              (out/(key+'.png')).write_bytes(render_png(key,{}, {},strict=False))
          print('PREVIEW: 8 real blank masters, no invented tips')
          PY
      - name: Publish true rendered premium master PNGs
        uses: actions/upload-artifact@v4
        with:
          name: nba-premium-v2-8-master-previews
          path: diagnostics/nba_premium_v2/*.png
          retention-days: 14
          if-no-files-found: error
