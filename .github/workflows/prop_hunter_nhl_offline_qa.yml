name: PROP HUNTER NHL Offline Portrait QA
"on":
  pull_request:
    branches: [main]
    paths:
      - prop_hunter_nhl_cards.py
      - test_prop_hunter_nhl_production_cards.py
      - prop_hunter_image_cards.py
      - prop_hunter_image_publication_gate.py
      - prop_hunter_nfl_cards.py
      - prophunter_core_1391.py
      - prop_hunter_nhl_offline_layout.py
      - test_prop_hunter_nhl_offline_layout.py
      - prop_hunter_nhl_offline_assets.py
      - test_prop_hunter_nhl_offline_assets.py
      - .github/workflows/prop_hunter_nhl_offline_qa.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest cairosvg pillow requests
      - run: python -m pytest -q test_prop_hunter_nhl_offline_layout.py test_prop_hunter_nhl_offline_assets.py test_prop_hunter_nhl_production_cards.py
      - run: python prop_hunter_nhl_offline_layout.py
      - run: |
          python - <<'PY'
          import pathlib, cairosvg
          for f in pathlib.Path('output/nhl_offline').rglob('*.svg'):
              cairosvg.svg2png(url=str(f),write_to=str(f.with_suffix('.png')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-offline-portraits
          path: output/nhl_offline/
