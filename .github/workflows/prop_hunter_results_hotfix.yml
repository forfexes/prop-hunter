name: Prop Hunter Results Hotfix

"on":
  push:
    branches: [main]
    paths:
      - '.results-hotfix-trigger'

permissions:
  contents: write

concurrency:
  group: prop-hunter-results
  cancel-in-progress: false

jobs:
  results-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_results.txt

      - name: Install
        run: pip install -r requirements_results.txt

      - name: Regression
        run: |
          python -m py_compile prop_hunter_results_mlb.py prop_hunter_results_wnba.py prop_hunter_results_nhl.py prop_hunter_settler.py prophunter_results.py
          python prop_hunter_expansion_test.py

      - name: Fetch pending official results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PH_MLB_RESULTS_MAX_PLAYERS: '120'
          PH_MLB_RESULTS_LOOKBACK_DAYS: '4'
          WNBA_RESULTS_MAX_DATES: '7'
          WNBA_RESULT_GAME_CAP: '20'
          NFL_RESULTS_PLAYER_CAP: '120'
          NHL_RESULTS_PLAYER_CAP: '100'
          HTTP_TIMEOUT: '8'
        run: |
          python prop_hunter_results_mlb.py || true
          python prop_hunter_results_mlb_extras.py || true
          python prop_hunter_results_wnba.py || true
          python prop_hunter_results_nfl.py || true
          python prop_hunter_results_nhl.py || true

      - name: Settle and update Telegram cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PH_RESULTS_LOOKBACK_DAYS: '4'
          PH_RESULTS_FALLBACK_SUMMARY: '0'
          PH_RESULTS_HTTP_TIMEOUT: '8'
        run: |
          python prop_hunter_feature_builder.py || true
          python prop_hunter_settler.py
          python prop_hunter_settler_extras.py
          python prophunter_results.py

      - name: Save settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add picks_history.json prop_hunter_builder_correlations.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "prop hunter results hotfix $(date -u +%F-%H%M)"
          git push origin main
