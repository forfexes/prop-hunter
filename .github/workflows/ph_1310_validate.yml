name: PH 13.10 One-Shot Validate

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/ph_1310_validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile and hard test
        env:
          PH_EXPECTED_RUNTIME_VERSION: 13.10.0-MULTISOURCE-CONSENSUS
        run: |
          python -m compileall -q .
          python prop_hunter_runtime_guard.py
          python prop_hunter_hard_test.py
      - name: Live source smoke MLB only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROP_HUNTER_SPORTS: MLB
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PH_DIRECT_ROWS_PER_SPORT_TARGET: '99999'
          PH_DIRECT_BOOK_TARGET: '99'
          PH_DIRECT_PAIR_TARGET: '99999'
          PH_KAMBI_ENABLED: '1'
          PH_KAMBI_MAX_EVENTS: '1'
          PH_KAMBI_MAX_BRANDS: '4'
          PH_KAMBI_TIMEOUT: '4'
          PH_1XBET_ENABLED: '1'
          PH_1XBET_MAX_EVENTS: '1'
          PH_1XBET_TIMEOUT: '4'
          PH_SKIP_BLOCKED_FREE: '1'
          PH_BROWSER_ENABLED: '0'
        run: python prop_hunter_source_orchestrator.py --mode fast --sport MLB
