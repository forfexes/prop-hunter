name: Prop Hunter SHL Statnet Probe

"on":
  push:
    paths:
      - 'prop_hunter_probe_shl_statnet.py'
      - '.github/shl-probe-trigger'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf pdfplumber
      - run: python prop_hunter_probe_shl_statnet.py
