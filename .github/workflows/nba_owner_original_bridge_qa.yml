name: PROP HUNTER NBA Actual Owner Originals Integration QA

"on":
  workflow_dispatch: {}
  push:
    paths:
      - 'prop_hunter_nba_owner_bridge.py'
      - 'prop_hunter_image_cards.py'
      - 'prop_hunter_confidence_display.py'
      - 'test_prop_hunter_confidence_display.py'
      - 'prop_hunter_owner_supplied_single.py'
      - 'test_prop_hunter_owner_supplied_single.py'
      - 'card_templates/owner_supplied/**'
      - 'prop_hunter_nba_premium_adapter.py'
      - 'prop_hunter_nba_premium_adapter_test.py'
      - 'test_prop_hunter_nba_priced_leg_identity.py'
      - 'prop_hunter_original_compositor.py'
      - 'prop_hunter_owner_clean_single.py'
      - 'test_prop_hunter_single_overlay_geometry.py'
      - 'test_prop_hunter_owner_pending_status.py'
      - 'prop_hunter_telegram_sandbox_hardtest.py'
      - 'prop_hunter_owner_clean_ladder.py'
      - 'test_prop_hunter_ladder_form_windows.py'
      - 'test_prop_hunter_ladder_per_rung_form.py'
      - 'prop_hunter_owner_clean_builder.py'
      - 'test_prop_hunter_builder_no_duplicate_portrait_names.py'
      - 'test_prop_hunter_crest_slots.py'
      - 'test_prop_hunter_owner_builder_floating_status.py'
      - 'prop_hunter_owner_clean_lottery.py'
      - 'test_prop_hunter_nba_owner_bridge.py'
      - 'test_prop_hunter_owner_date_integrity.py'
      - 'test_prop_hunter_owner_ladder_settlement_rows.py'
      - 'prop_hunter_owner_leg_status.py'
      - 'test_prop_hunter_owner_leg_status.py'
      - 'prop_hunter_borderless_portrait_test.py'
      - 'prop_hunter_owner_pixel_qa.py'
      - 'test_prop_hunter_owner_pixel_qa.py'
      - 'card_templates/cleaned/**'
      - 'card_templates/approved/**'
      - '.github/workflows/prophunter.yml'
      - '.github/workflows/prophunter_results.yml'
      - '.github/workflows/nba_owner_original_bridge_qa.yml'

permissions:
  contents: read

jobs:
  # Archive the untouched owner screenshots separately from synthetic render
  # previews. Helps verify design provenance without any overlay or rewrite.
  export-unchanged-owner-jpg:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: original-owner-nba-single-ladder-jpg
          path: |
            card_templates/originals/single.jpg
            card_templates/originals/ladder.jpg
          retention-days: 7
          if-no-files-found: error

  no-telegram-owner-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated bitmap compositing dependencies
        run: python -m pip install --quiet pillow requests numpy cairosvg
      - name: Compile source and run strict approved-owner adapter regression
        run: |
          python -m py_compile prop_hunter_nba_owner_bridge.py prop_hunter_nba_premium_adapter.py
          python -m py_compile prop_hunter_original_compositor.py test_prop_hunter_nba_owner_bridge.py test_prop_hunter_owner_ladder_settlement_rows.py
          python -m py_compile prop_hunter_owner_clean_single.py prop_hunter_borderless_portrait_test.py test_prop_hunter_single_overlay_geometry.py prop_hunter_telegram_sandbox_hardtest.py
          python -m py_compile prop_hunter_owner_clean_ladder.py test_prop_hunter_ladder_form_windows.py
          python -m py_compile prop_hunter_owner_clean_builder.py prop_hunter_owner_leg_status.py test_prop_hunter_owner_leg_status.py
          python -m py_compile prop_hunter_owner_clean_lottery.py
          python -m py_compile prop_hunter_owner_supplied_single.py test_prop_hunter_owner_supplied_single.py
          python -m py_compile test_prop_hunter_crest_slots.py
          python -m unittest -v test_prop_hunter_crest_slots
          python -m unittest -v test_prop_hunter_owner_supplied_single
          python test_prop_hunter_single_overlay_geometry.py
          python test_prop_hunter_owner_pending_status.py
          python test_prop_hunter_owner_builder_floating_status.py
          python -m unittest -v test_prop_hunter_builder_no_duplicate_portrait_names
          python test_prop_hunter_nba_owner_bridge.py
          python prop_hunter_nba_premium_adapter_test.py
          python -m unittest -v test_prop_hunter_nba_priced_leg_identity
          python -m unittest -v test_prop_hunter_owner_date_integrity
          python test_prop_hunter_ladder_form_windows.py
          python -m unittest -v test_prop_hunter_ladder_per_rung_form
          python -m py_compile prop_hunter_confidence_display.py test_prop_hunter_confidence_display.py
          python -m unittest -v test_prop_hunter_confidence_display
          python test_prop_hunter_owner_ladder_settlement_rows.py
          python test_prop_hunter_owner_leg_status.py
          python prop_hunter_borderless_portrait_test.py
          python test_prop_hunter_owner_pixel_qa.py
      - name: Telegram Android-style OFFLINE visual hardtest of ALL owner card variants
        run: |
          python prop_hunter_telegram_sandbox_hardtest.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/telegram_sandbox/manifest.json').read_text())
          assert sum(v['status']=='PASS' for v in d.values())>=19
          assert all(d['unapproved_'+s]['status']=='BLOCKED_NO_OWNER_ART'
                     for s in ('NFL','NHL','MLB','WNBA','EUROLEAGUE'))
          print('OFFLINE TG SCREENSHOT CONTRACT PASS; NO LIVE TELEGRAM SEND')
          PY
      - name: Check BOTH Telegram workflows use approved originals and never legacy
        run: |
          python - <<'PY'
          from pathlib import Path
          for wf in ('.github/workflows/prophunter.yml',
                     '.github/workflows/prophunter_results.yml'):
              text=Path(wf).read_text()
              assert "PH_NBA_OWNER_ORIGINALS: '1'" in text, wf
              assert "PH_NBA_PREMIUM_V2_REQUIRE: '1'" in text, wf
              assert "PH_OWNER_PIXEL_QA: '1'" in text, wf
              assert 'python test_prop_hunter_nba_owner_bridge.py' in text, wf
          for family in ('single','ladder','builder','lottery'):
              path=Path('card_templates/approved')/(family+'.png')
              assert path.is_file(),path
          print('PRODUCTION_NBA_OWNER_ORIGINALS_GUARDED_IN_BOTH_WORKFLOWS')
          PY
      - name: Show four synthetic source-original previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io
          for name in ('single','ladder','builder','lottery'):
              path=Path('output/nba_owner_qa')/(name+'.png')
              with Image.open(path) as source:
                  thumb=source.convert('RGB')
                  thumb.thumbnail((420,560),Image.Resampling.LANCZOS)
                  b=io.BytesIO()
                  thumb.save(b,'JPEG',quality=55,optimize=True)
              print('NBA_OWNER_ACTUAL_PREVIEW '+name+' '+
                    base64.b64encode(b.getvalue()).decode('ascii'))
          print('Source-derived artwork QA ONLY; no Telegram send')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-true-owner-single-ladder-builder-qa
          path: |
            output/nba_owner_qa/*.png
            output/telegram_sandbox/*.png
            output/telegram_sandbox/manifest.json
            preview_single_owner_telegram_safe.png
            preview_single_open.png
            preview_single_won.png
            card_templates/originals/single.jpg
            card_templates/originals/ladder.jpg
          retention-days: 7
