name: Prop Hunter Feature Rebuild

"on":
  push:
    paths:
      - ".github/feature-rebuild-trigger"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prop-hunter-feature-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_results.txt
      - run: pip install -r requirements_results.txt
      - name: Regression
        run: |
          python -m py_compile prop_hunter_feature_builder.py prop_hunter_shared_utils.py prop_hunter_gamelog_retention.py
          python prop_hunter_gamelog_retention_test.py
          python prop_hunter_expansion_test.py
      - name: Retain 15 games and rebuild all player features
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PH_GAMELOG_KEEP_PER_PLAYER: "15"
          PH_FEATURE_WRITE_BATCH: "400"
        run: |
          python prop_hunter_gamelog_retention.py --apply
          python prop_hunter_feature_builder.py
