name: Prop Hunter Snapshot Reconcile
"on":
  workflow_run:
    workflows: ["Prop Hunter Safe Snapshot Transfer"]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: prop-hunter-snapshot-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned transport
        run: python -m pip install requests==2.32.5
      - name: Reconcile all original snapshot IDs and verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SECONDARY_URL: ${{ secrets.SUPABASE_SECONDARY_URL }}
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECONDARY_SERVICE_ROLE_KEY }}
        run: python prop_hunter_snapshot_reconcile.py
      - name: Save reconciliation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prop-hunter-snapshot-reconcile-proof
          path: prop_hunter_snapshot_reconcile_report.json
          retention-days: 30
