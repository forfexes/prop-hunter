name: PROP HUNTER NFL Offline QA

on:
  push:
    branches: [nfl/offline-card-templates]
    paths:
      - .github/workflows/prop_hunter_nfl_offline_qa.yml
      - card_templates/nfl/**
      - prop_hunter_image_cards.py
      - prop_hunter_nfl_cards.py
      - prop_hunter_combo_prices.py
      - prop_hunter_image_publication_gate.py
      - prophunter_core_1391.py
      - prophunter_results.py
      - test_prop_hunter_premium_only.py
      - test_prop_hunter_nfl_cards.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prop_hunter_nfl_offline_qa.yml
      - card_templates/nfl/**
      - prop_hunter_*cards.py
      - prop_hunter_combo_prices.py
      - prop_hunter_image_publication_gate.py
      - prophunter_core_1391.py
      - prophunter_results.py
      - test_prop_hunter_nfl_cards.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests pytest
      - run: python -m pytest -q test_prop_hunter_nfl_cards.py test_prop_hunter_premium_only.py
      - name: Verify 17 canvas renders and PNG encodings in Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu             --user-data-dir="$RUNNER_TEMP/prop-hunter-nfl-chrome"             --virtual-time-budget=10000 --dump-dom             "file://$PWD/card_templates/nfl/PROP_HUNTER_NFL_Vorlagen.html?test" > "$RUNNER_TEMP/nfl-dom.html"
          grep -q 'data-test="ok-17"' "$RUNNER_TEMP/nfl-dom.html"
