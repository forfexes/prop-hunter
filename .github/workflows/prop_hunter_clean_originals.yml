name: PROP HUNTER Clean Owner Original Templates
"on":
  push:
    paths:
      - 'prop_hunter_clean_templates.py'
      - '.github/workflows/prop_hunter_clean_originals.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact image cleaning dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10' 'opencv-python-headless>=4.9,<5'
      - name: Reconstruct the four owner source plates
        run: python -u prop_hunter_clean_templates.py
      - name: Assert original screenshots are retained and branding untouched
        run: |
          python - <<'PY'
          import numpy as np
          from PIL import Image
          from pathlib import Path
          from prop_hunter_original_compositor import CROP,FAMILIES
          for name in FAMILIES:
              src=np.asarray(Image.open(Path('card_templates/originals')/(name+'.jpg')).convert('RGB').crop(CROP[name]))
              dst=np.asarray(Image.open(Path('card_templates/cleaned')/(name+'.png')).convert('RGB'))
              mask=np.asarray(Image.open(Path('diagnostics')/('template_cleanup_mask_'+name+'.png')))
              assert dst.shape==src.shape and np.any(dst!=src)
              assert np.array_equal(dst[mask==0],src[mask==0])
              # The original NBA/PROP-HUNTER branding stays byte-identical.
              assert np.array_equal(dst[2:30,270:420],src[2:30,270:420])
              print(name,'cleaned-source OK',flush=True)
          PY
      - name: Compose all four original-owner cards with SYNTHETIC QA data
        run: |
          python - <<'PY'
          import io, base64
          from pathlib import Path
          from PIL import Image, ImageDraw
          import prop_hunter_original_compositor as original
          original.APPROVED_MASTER=Path('card_templates/cleaned')
          original._source.cache_clear()
          player=Image.new('RGBA',(170,220),(0,0,0,0))
          draw=ImageDraw.Draw(player)
          draw.ellipse((36,12,140,118),fill=(65,140,220,255))
          draw.rounded_rectangle((11,105,159,216),20,fill=(31,67,125,255))
          logo=Image.new('RGBA',(100,100),(0,0,0,0))
          ImageDraw.Draw(logo).ellipse((10,10,90,90),fill=(43,195,231,255))
          teams=[('HOME TEAM',logo),('AWAY TEAM',logo)]
          for family in ('single','ladder','builder','lottery'):
              count={'single':1,'ladder':3,'builder':3,'lottery':3}[family]
              rows=[{'name':'TEST PLAYER' if family=='ladder' else 'TEST PLAYER '+str(i+1),
                     'photo':player.copy(),
                     'label':'Over 20.5 points','odds':'@1.80',
                     'form':'L5 3/5 · L10 7/10 · L15 11/15',
                     'model':{'prob':'65','edge':'+9','confidence':'80/100'}}
                    for i in range(count)]
              raw=original.original_card(family,family.upper(),
                  'HOME TEAM vs AWAY TEAM · 20.11.2026 20:00',
                  'NBA',teams,rows,
                  'Quote @4.25 · Einsatz 1u','OFFEN')
              with Image.open(io.BytesIO(raw)) as image:
                  assert image.size[0]==1080 and image.size[1]>1100
                  thumb=image.convert('RGB')
                  thumb.thumbnail((430,590),Image.Resampling.LANCZOS)
                  out=io.BytesIO()
                  thumb.save(out,'JPEG',quality=56,optimize=True)
              Path('diagnostics/rendered_owner_'+family+'.png').write_bytes(raw)
              print('OWNER_COMPOSED_PREVIEW '+family+' '+
                    base64.b64encode(out.getvalue()).decode('ascii'))
          print('Composed clean owner references are QA ONLY; no Telegram publication')
          PY
      - name: Expose four cleaned owner-source previews for independent visual approval
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io
          for family in ('single','ladder','builder','lottery'):
              path=Path('card_templates/cleaned')/(family+'.png')
              with Image.open(path) as original:
                  image=original.convert('RGB')
                  image.thumbnail((430,590),Image.Resampling.LANCZOS)
                  buf=io.BytesIO()
                  image.save(buf,'JPEG',quality=53,optimize=True)
              print('OWNER_CLEANED_PREVIEW '+family+' '+
                    base64.b64encode(buf.getvalue()).decode('ascii'))
          print('PREVIEW ONLY: no Telegram publishing or original artwork approval')
          PY
      - name: Export clean image plates and masks for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-prop-hunter-owner-template-qa
          path: |
            card_templates/cleaned/*.png
            diagnostics/template_cleanup_mask_*.png
            diagnostics/template_cleanup_report.json
          retention-days: 7
          if-no-files-found: error
      - name: Store reviewed clean plates in GitHub as NON-PRODUCTION working assets
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for family in single ladder builder lottery; do
            test -s "card_templates/cleaned/${family}.png"
          done
          git add card_templates/cleaned/single.png card_templates/cleaned/ladder.png \
                  card_templates/cleaned/builder.png card_templates/cleaned/lottery.png
          if git diff --staged --quiet; then
            echo "All four clean working plates already in GitHub"
            exit 0
          fi
          git commit -m "assets: store four clean owner-source working plates (NOT production-approved)"
          # Branch tip may advance while this CPU-heavy image clean-up runs.
          # Never overwrite other workflow commits or push a stale checkout.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Four true-owner working assets stored; production approval remains gated"
              exit 0
            fi
            sleep $((3 * attempt))
          done
          echo "CRITICAL: cleaned source plates not saved after three safe rebase attempts"
          exit 1
