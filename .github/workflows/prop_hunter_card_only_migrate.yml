name: Prop Hunter v3 Existing Telegram Card Migration
"on":
  push:
    paths:
      - ".github/workflows/prop_hunter_card_only_migrate.yml"
      - ".github/card-only-migrate-trigger"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: prop-hunter-history-writer
  cancel-in-progress: false
jobs:
  migrate_existing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal image dependencies
        run: python -m pip install "requests>=2.31" "Pillow>=10"
      - name: Verify original-card editing and rollback safeguards
        run: |
          python -m py_compile prophunter_results.py prop_hunter_image_cards.py prop_hunter_card_only_migrate.py
          python prop_hunter_media_settlement_test.py
          python prop_hunter_card_design_migration_test.py
          python prop_hunter_card_pending_visual_test.py
          python prop_hunter_decisive_leg_test.py
          python prop_hunter_card_history_integrity_test.py
      - name: Edit existing Telegram cards only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PH_CARD_ONLY_MAX_UPDATES: '35'
          PH_CARD_ONLY_LOOKBACK_DAYS: '7'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing; refusing migration"
            exit 1
          fi
          # Restore only independently proven lost message IDs from run
          # 44199830731; refuse mismatched DB rows/events and duplicates.
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          history=json.loads(Path("picks_history.json").read_text(encoding="utf8"))
          if any(e.get("date")=="2026-11-17" and e.get("cards") for e in history):
              print("Card recovery already completed; not rebuilding")
          else:
              subprocess.run([sys.executable,"prop_hunter_restore_verified_20261117_cards.py"],check=True)
          PY
          python -u prop_hunter_card_only_migrate.py
      - name: Save updated original card IDs to history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python -m json.tool picks_history.json >/dev/null
          git add picks_history.json diagnostics/prop_hunter_card_only_migration_status.json
          if git diff --staged --quiet; then
            echo "No Telegram card changes to commit"
            exit 0
          fi
          git commit -m "prop hunter: preserve Telegram v3 card migrations [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Fail visibly if original photos remain unconverted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("diagnostics/prop_hunter_card_only_migration_status.json").read_text())
          failed=int(status.get("failed") or 0)
          print(f"Card migration: updated={status.get('photo_updated',0)} failed={failed}")
          if failed:
              print(f"::error::{failed} original Telegram photos could not be upgraded; see failed_cards and render errors")
              raise SystemExit(1)
          PY
